<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>噪律暗号</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js" onerror="window.__noLame=1"></script>
<style>
:root{
  --sumi:#0E1016; --ai:#161B29; --ai2:#1F2637; --line:#2C3448;
  --kinu:#EDE4D2; --kincha:#C8A23C; --kincha-d:#8E7228; --shu:#C25A45; --nezu:#7C8496;
  --disp:"Shippori Mincho B1",serif;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"DM Mono","Zen Kaku Gothic New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sumi); color:var(--kinu); font-family:var(--body);
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 120% 80% at 50% -10%,#1B2234 0%,transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 96px}

/* ── 見出し ── */
header{padding:72px 0 40px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--kincha);
  text-transform:uppercase;margin:0 0 20px}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(48px,10vw,88px);
  letter-spacing:.16em;margin:0;line-height:1;text-indent:.16em}
.yomi{font-family:var(--disp);font-size:13px;letter-spacing:.5em;color:var(--nezu);
  margin:18px 0 0;text-indent:.5em}
.lede{max-width:46ch;margin:26px 0 0;color:#C3BCAC;font-size:14.5px}

/* ── 部品 ── */
.tabs{display:flex;gap:2px;margin:44px 0 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--nezu);
  font-family:var(--disp);font-size:16px;letter-spacing:.18em;padding:12px 22px;cursor:pointer;
  transition:color .2s,border-color .2s}
.tab:hover{color:var(--kinu)}
.tab[aria-selected="true"]{color:var(--kincha);border-bottom-color:var(--kincha)}
.tab:focus-visible{outline:2px solid var(--kincha);outline-offset:2px}

.panel{display:none;padding-top:40px}
.panel.on{display:block}

.grid{display:grid;grid-template-columns:1fr 340px;gap:44px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:34px}}

label.fld{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.24em;
  color:var(--nezu);margin:0 0 10px;text-transform:uppercase}
textarea{
  width:100%;min-height:150px;resize:vertical;background:var(--ai);color:var(--kinu);
  border:1px solid var(--line);border-radius:2px;padding:16px 18px;font-family:var(--body);
  font-size:16px;line-height:1.9;transition:border-color .2s}
textarea:focus{outline:none;border-color:var(--kincha-d)}
textarea::placeholder{color:#4E566B}

.row{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;align-items:flex-end}
.ctl{flex:1;min-width:150px}
select,input[type=range]{width:100%;background:var(--ai);color:var(--kinu);
  border:1px solid var(--line);border-radius:2px;padding:10px 12px;font-family:var(--body);font-size:14px}
select:focus,input:focus{outline:none;border-color:var(--kincha-d)}
input[type=range]{padding:0;height:30px;accent-color:var(--kincha);border:0;background:none}

button{font-family:var(--disp);cursor:pointer;transition:all .18s}
button:focus-visible{outline:2px solid var(--kincha);outline-offset:3px}
.primary{background:var(--kincha);color:#12141B;border:0;border-radius:2px;
  font-size:17px;letter-spacing:.3em;padding:15px 40px;font-weight:700;text-indent:.3em;margin-top:30px}
.primary:hover{background:#DCB748}
.primary:disabled{background:var(--ai2);color:#565E73;cursor:not-allowed}
.ghost{background:none;color:var(--kinu);border:1px solid var(--line);border-radius:2px;
  font-size:14px;letter-spacing:.2em;padding:11px 20px;text-indent:.2em}
.ghost:hover{border-color:var(--kincha-d);color:var(--kincha)}
.ghost[aria-pressed="true"]{border-color:var(--kincha);color:var(--kincha);background:#1B1B14}
.mini{font-family:var(--mono);font-size:11px;letter-spacing:.14em;background:none;
  border:0;color:var(--nezu);padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.mini:hover{color:var(--kincha)}

/* ── 音律環 ── */
.ring-box{background:var(--ai);border:1px solid var(--line);border-radius:2px;padding:20px 16px 14px}
.ring-cap{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--nezu);
  text-align:center;margin:0 0 4px}
svg.ring{display:block;width:100%;height:auto}
.rn-dot{fill:var(--ai2);stroke:var(--line);stroke-width:1}
.rn-name{font-family:var(--body);font-size:11px;fill:#9AA2B4;text-anchor:middle;dominant-baseline:middle}
.rn-num{font-family:var(--mono);font-size:12px;fill:var(--kincha);text-anchor:middle;dominant-baseline:middle}
.rn-ritsu{font-family:var(--disp);font-size:9px;fill:#525B70;text-anchor:middle;dominant-baseline:middle}
.rn.lit .rn-dot{fill:var(--kincha);stroke:var(--kincha)}
.rn.lit .rn-num{fill:#12141B}
.rn.lit .rn-name{fill:var(--kinu)}
.rn-dot{transition:fill .12s,stroke .12s}

/* ── 出力 ── */
.out{margin-top:56px;border-top:1px solid var(--line);padding-top:34px;display:none}
.out.on{display:block}
.stat{display:flex;gap:34px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  letter-spacing:.1em;color:var(--nezu);margin:0 0 26px}
.stat b{color:var(--kinu);font-weight:500}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.drawer{display:none;margin-top:30px}
.drawer.on{display:block}

.scroll{overflow-x:auto;background:#0A0C11;border:1px solid var(--line);border-radius:2px}
canvas#score{display:block;width:1160px;max-width:none}
@media(max-width:1160px){canvas#score{width:1160px}}

.names{background:var(--ai);border:1px solid var(--line);border-radius:2px;padding:22px}
.names h4{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--kincha);
  margin:0 0 12px;font-weight:400}
.names h4:not(:first-child){margin-top:26px}
.nlist{display:flex;flex-wrap:wrap;gap:5px}
.nn{font-family:var(--body);font-size:13px;background:var(--ai2);border-radius:2px;
  padding:3px 9px;color:#CFC8B8;min-width:34px;text-align:center}
.nn.hd{background:#241F12;color:var(--kincha)}
.nn.st{background:#2A1F14;color:#E0A94C;box-shadow:inset 0 0 0 1px var(--kincha-d)}

.oneline{width:100%;background:#0A0C11;color:#CFC8B8;border:1px solid var(--line);
  border-radius:2px;padding:12px 14px;font-family:var(--body);font-size:13.5px;
  white-space:pre;overflow-x:auto;resize:none;height:44px;line-height:1.4}
.oneline:focus{outline:none;border-color:var(--kincha-d)}
.linebar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.copied{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--kincha);opacity:0;
  transition:opacity .2s}
.copied.on{opacity:1}

.msg{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;margin-top:18px;
  padding:12px 16px;border-left:2px solid var(--shu);background:#1C1418;color:#E0A99C;display:none}
.msg.on{display:block}
.ok{border-left-color:var(--kincha);background:#1A1810;color:#D8C48A}

.result{background:var(--ai);border:1px solid var(--line);border-radius:2px;padding:22px 24px;
  margin-top:28px;font-size:17px;line-height:2;white-space:pre-wrap;word-break:break-word;display:none}
.result.on{display:block}

footer{margin-top:96px;border-top:1px solid var(--line);padding-top:26px;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#4E566B}
footer p{margin:0 0 6px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">Souritsu Cipher — 仕様 v1.0</p>
  <h1>噪律暗号</h1>
  <p class="yomi">そうりつあんごう</p>
  <p class="lede">文字を十二平均律の音高に写す、可逆の変換。読み解くのに必要なものは、すべて曲そのものの中に書かれています。</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-enc" aria-selected="true" aria-controls="p-enc">文を曲に</button>
  <button class="tab" role="tab" id="t-dec" aria-selected="false" aria-controls="p-dec">曲を文に</button>
</div>

<!-- ══════ 符号化 ══════ -->
<section class="panel on" id="p-enc" role="tabpanel" aria-labelledby="t-enc">
<div class="grid">
  <div>
    <label class="fld" for="src">本文</label>
    <textarea id="src" placeholder="ここに文を書きます。">こんにちは、世界AI2026。</textarea>

    <div class="row">
      <div class="ctl">
        <label class="fld" for="inst">楽器</label>
        <select id="inst">
          <option value="piano">ピアノ</option>
          <option value="chip">電子ビット音</option>
          <option value="box">オルゴール</option>
          <option value="glock">鉄琴</option>
          <option value="koto">箏</option>
          <option value="organ">電子オルガン</option>
        </select>
      </div>
      <div class="ctl">
        <label class="fld" for="tempo">速さ <span id="tempoV">3.5</span> 音/秒</label>
        <input type="range" id="tempo" min="1.5" max="8" step="0.5" value="3.5">
      </div>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="mini" id="reroll">鍵表を引き直す</button>
    </div>

    <button class="primary" id="go">奏でる</button>
  </div>

  <div class="ring-box">
    <p class="ring-cap">音律環 — 鍵表</p>
    <svg class="ring" id="ring" viewBox="0 0 300 300" aria-label="十二音と数字の対応表"></svg>
  </div>
</div>

<div class="msg" id="encMsg"></div>

<div class="out" id="out">
  <div class="stat">
    <span>音数 <b id="sNotes">—</b></span>
    <span>様式 <b id="sStyle">—</b></span>
    <span>区切り <b id="sBlk">—</b></span>
    <span>長さ <b id="sDens">—</b></span>
  </div>
  <div class="bar">
    <button class="ghost" id="play">聴く</button>
    <button class="ghost" id="dlAudio">音を書き出す</button>
    <button class="ghost" id="bScore" aria-pressed="false">譜に起こす</button>
    <button class="ghost" id="bNames" aria-pressed="false">音名で読む</button>
  </div>

  <div class="drawer" id="dScore">
    <div class="row" style="margin:0 0 16px">
      <label style="font-size:13px;color:var(--nezu);display:flex;gap:9px;align-items:center;cursor:pointer">
        <input type="checkbox" id="legend" style="width:auto;accent-color:var(--kincha)"> 読み方の注記を譜面に添える
      </label>
      <button class="ghost" id="dlScore" style="margin-left:auto">譜面を書き出す</button>
    </div>
    <div class="scroll"><canvas id="score"></canvas></div>
  </div>

  <div class="drawer" id="dNames">
    <div class="names">
      <h4>1行の音名</h4>
      <textarea class="oneline" id="oneline" readonly spellcheck="false"></textarea>
      <div class="linebar">
        <button class="ghost" id="copyLine">コピー</button>
        <button class="ghost" id="swKana" aria-pressed="true">ドレミ</button>
        <button class="ghost" id="swEn" aria-pressed="false">CDE</button>
        <span class="copied" id="copied">コピーしました</span>
      </div>
      <h4>鍵表 — 数字 0〜11 の順</h4><div class="nlist" id="nlRow"></div>
      <h4>様式</h4><div class="nlist" id="nlStyle"></div>
      <h4>本体</h4><div class="nlist" id="nlBody"></div>
    </div>
  </div>
</div>
</section>

<!-- ══════ 復号 ══════ -->
<section class="panel" id="p-dec" role="tabpanel" aria-labelledby="t-dec">
  <label class="fld" for="dsrc">音名 — ドレミでも CDE でも、空白か読点で区切ります</label>
  <textarea id="dsrc" placeholder="ソ ファ レ ソ♯ ラ ファ♯ シ レ♯ ミ ド ド♯ ラ♯ ソ …"></textarea>
  <button class="primary" id="dgo">文に戻す</button>
  <div class="msg" id="decMsg"></div>
  <div class="result" id="dres"></div>
</section>

<footer>
  <p>先頭12音が鍵表、13音目が様式、以降は19音ごとの区切り。</p>
  <p>鍵表は曲の中に含まれます。秘匿の用途には使えません。</p>
</footer>
</div>

<script>
"use strict";
/* ══════════════════ 変換の中核（仕様 v1.0） ══════════════════ */
const JA=["ド","ド♯","レ","レ♯","ミ","ファ","ファ♯","ソ","ソ♯","ラ","ラ♯","シ"];
const EN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const RITSU=["神仙","上無","壱越","断金","平調","勝絶","下無","双調","鳧鐘","黄鐘","鸞鏡","盤渉"];
const STYLES={0:{hexw:4,per:4,dig:18},1:{hexw:6,per:4,dig:27}};

function makeRow(){
  const r=[...Array(12).keys()];
  for(let i=11;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
function toUnits(t,st){
  if(st===1) return [...t].map(c=>c.codePointAt(0));
  const u=[];
  for(const ch of t){const c=ch.codePointAt(0);
    if(c>0xFFFF){const v=c-0x10000;u.push(0xD800|(v>>10),0xDC00|(v&0x3FF));}else u.push(c);}
  return u;
}
function fromUnits(u,st){
  return st===1 ? u.map(x=>String.fromCodePoint(x)).join('')
                : u.map(x=>String.fromCharCode(x)).join('');
}
function autoStyle(t,check){
  const c=check?1:0, a=[...t].filter(x=>x.codePointAt(0)>0xFFFF).length, L=[...t].length;
  return Math.ceil((L+a)/4)*(18+c) <= Math.ceil(L/4)*(27+c) ? 0 : 1;
}
function encode(text,row,style,check=true){
  if(style==null) style=autoStyle(text,check);
  const S=STYLES[style], sh=BigInt(S.hexw*4);
  const u=toUnits(text,style);
  while(u.length%S.per) u.push(0);
  const out=row.concat([row[style]]);
  for(let i=0;i<u.length;i+=S.per){
    let n=0n;
    for(let k=0;k<S.per;k++) n=(n<<sh)|BigInt(u[i+k]);
    const d=[];
    for(let k=0;k<S.dig;k++){d.push(Number(n%12n)); n/=12n;}
    d.reverse();
    if(check) d.push(d.reduce((a,b)=>a+b,0)%12);
    for(const x of d) out.push(row[x]);
  }
  return {pcs:out,style,blk:S.dig+(check?1:0)};
}
function decode(pcs,check=true){
  if(pcs.length<13) throw new Error("音が足りません。最低13音必要です。");
  const row=pcs.slice(0,12);
  if(new Set(row).size!==12) throw new Error("冒頭12音に同じ音名があります。鍵表として読めません。");
  const inv={}; row.forEach((p,i)=>inv[p]=i);
  const style=inv[pcs[12]];
  if(!(style in STYLES)) throw new Error("13音目の様式番号 "+style+" は未定義です。");
  const S=STYLES[style], sh=BigInt(S.hexw*4), mask=(1n<<sh)-1n;
  const body=pcs.slice(13), w=S.dig+(check?1:0);
  if(body.length%w) throw new Error(`本体が${body.length}音で、${w}の倍数になりません。`);
  let u=[];
  for(let i=0;i<body.length;i+=w){
    const d=body.slice(i,i+w).map(p=>inv[p]);
    if(check && d.slice(0,S.dig).reduce((a,b)=>a+b,0)%12!==d[S.dig])
      throw new Error(`第${i/w+1}区切りの検査音が合いません。写し間違いがあります。`);
    let n=0n;
    for(let k=0;k<S.dig;k++) n=n*12n+BigInt(d[k]);
    for(let s=S.per-1;s>=0;s--) u.push(Number((n>>(sh*BigInt(s)))&mask));
  }
  while(u.length && u[u.length-1]===0) u.pop();
  return fromUnits(u,style);
}
const BASE_JA={"ド":0,"レ":2,"ミ":4,"ファ":5,"ソ":7,"ラ":9,"シ":11};
const BASE_EN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parseNotes(s){
  const t=s.replace(/[、,\/|・]/g," ").trim().split(/\s+/).filter(Boolean);
  return t.map(x=>{
    let n=x.trim(), acc=0;
    while(/[#＃♯b♭ｂ]$/.test(n)){ acc+=/[#＃♯]$/.test(n)?1:-1; n=n.slice(0,-1); }
    let base=BASE_JA[n];
    if(base===undefined) base=BASE_EN[n.toUpperCase()];
    if(base===undefined) throw new Error(`「${x}」は音名として読めません。`);
    return ((base+acc)%12+12)%12;
  });
}

/* ══════════════════ 音律環 ══════════════════ */
const ringEl=document.getElementById('ring');
let row=makeRow();
function drawRing(){
  const cx=150,cy=150,R=108;
  let h='<circle cx="150" cy="150" r="108" fill="none" stroke="#252C3E" stroke-width="1"/>';
  for(let p=0;p<12;p++){
    const a=(p/12)*Math.PI*2-Math.PI/2;
    const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    const lx=cx+(R+30)*Math.cos(a), ly=cy+(R+30)*Math.sin(a);
    const d=row.indexOf(p);
    h+=`<g class="rn" data-pc="${p}">
      <circle class="rn-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17"/>
      <text class="rn-num" x="${x.toFixed(1)}" y="${(y+1).toFixed(1)}">${d}</text>
      <text class="rn-name" x="${lx.toFixed(1)}" y="${(ly-5).toFixed(1)}">${JA[p]}</text>
      <text class="rn-ritsu" x="${lx.toFixed(1)}" y="${(ly+8).toFixed(1)}">${RITSU[p]}</text>
    </g>`;
  }
  ringEl.innerHTML=h;
}
function litRing(pc){
  ringEl.querySelectorAll('.rn').forEach(g=>
    g.classList.toggle('lit', +g.dataset.pc===pc));
}
drawRing();

/* ══════════════════ 発音 ══════════════════ */
const f=m=>440*Math.pow(2,(m-69)/12);
function noiseBuf(ctx){
  const b=ctx.createBuffer(1,2048,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<2048;i++) d[i]=(Math.random()*2-1)*(1-i/2048);
  return b;
}
function schedule(ctx,out,midi,t,gate,inst,nz){
  const F=f(midi);
  const add=(type,mul,amp,dec,det)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=F*mul; if(det) o.detune.value=det;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(amp,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
    o.connect(g).connect(out); o.start(t); o.stop(t+dec+0.05);
  };
  if(inst==='piano'){
    add('sine',1,0.34,2.1); add('sine',2,0.11,1.2); add('triangle',3,0.045,0.7);
    add('sine',1,0.12,1.8,7);
  }else if(inst==='chip'){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.value=F;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.17,t+0.004);
    g.gain.setValueAtTime(0.17,t+gate*0.8);
    g.gain.linearRampToValueAtTime(0,t+gate*0.9);
    o.connect(g).connect(out); o.start(t); o.stop(t+gate+0.05);
  }else if(inst==='box'){
    add('sine',1,0.30,1.5); add('sine',4.2,0.09,0.55); add('sine',6.9,0.035,0.3);
  }else if(inst==='glock'){
    add('sine',1,0.26,2.6); add('sine',2.76,0.13,1.5); add('sine',5.4,0.05,0.7);
  }else if(inst==='koto'){
    const o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=F;
    lp.type='lowpass';
    lp.frequency.setValueAtTime(3600,t); lp.frequency.exponentialRampToValueAtTime(700,t+0.5);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.24,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    o.connect(lp).connect(g).connect(out); o.start(t); o.stop(t+1.2);
    const s=ctx.createBufferSource(), ng=ctx.createGain();
    s.buffer=nz; ng.gain.setValueAtTime(0.1,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    s.connect(ng).connect(out); s.start(t);
  }else{ // organ
    const mk=(mul,amp)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=F*mul;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(amp,t+0.07);
      g.gain.setValueAtTime(amp,t+gate*0.85);
      g.gain.linearRampToValueAtTime(0,t+gate*0.95+0.06);
      o.connect(g).connect(out); o.start(t); o.stop(t+gate+0.2);
    };
    mk(1,0.20); mk(2,0.10); mk(3,0.055); mk(5,0.022);
  }
}
function voice(pcs){
  let prev=69; const out=[];
  for(const p of pcs){
    let best=null;
    for(let m=60;m<=81;m++){
      if(m%12!==p) continue;
      if(best===null||Math.abs(m-prev)<Math.abs(best-prev)) best=m;
    }
    out.push(best); prev=best;
  }
  return out;
}
async function render(mel,inst,nps){
  const sr=44100, dt=1/nps, len=Math.ceil((mel.length*dt+2.6)*sr);
  const ctx=new OfflineAudioContext(1,len,sr);
  const master=ctx.createGain(); master.gain.value=0.85; master.connect(ctx.destination);
  const nz=noiseBuf(ctx);
  mel.forEach((m,i)=>schedule(ctx,master,m,0.05+i*dt,dt*0.95,inst,nz));
  return ctx.startRendering();
}
function wavBlob(buf){
  const d=buf.getChannelData(0), n=d.length;
  const ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
  const str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  str(0,'RIFF'); v.setUint32(4,36+n*2,true); str(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,buf.sampleRate,true); v.setUint32(28,buf.sampleRate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,d[i]));
    v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true);}
  return new Blob([ab],{type:'audio/wav'});
}
function mp3Blob(buf){
  if(window.__noLame||typeof lamejs==='undefined') return null;
  try{
    const enc=new lamejs.Mp3Encoder(1,buf.sampleRate,160);
    const d=buf.getChannelData(0), pcm=new Int16Array(d.length);
    for(let i=0;i<d.length;i++){const s=Math.max(-1,Math.min(1,d[i]));
      pcm[i]=s<0?s*0x8000:s*0x7FFF;}
    const parts=[];
    for(let i=0;i<pcm.length;i+=1152){
      const c=enc.encodeBuffer(pcm.subarray(i,i+1152));
      if(c.length) parts.push(new Uint8Array(c));
    }
    const e=enc.flush(); if(e.length) parts.push(new Uint8Array(e));
    return new Blob(parts,{type:'audio/mpeg'});
  }catch(_){ return null; }
}

/* ══════════════════ 譜面 ══════════════════ */
const STEP=[0,0,1,1,2,3,3,4,4,5,5,6], SHARP=[0,1,0,1,0,0,1,0,1,0,1,0];
const CLEF=[[-0.55,5.45],
 [[-0.15,5.65],[0.25,5.35],[0.25,4.95]],[[0.25,3.50],[0.25,1.00],[0.30,-0.55]],
 [[0.32,-1.05],[0.05,-1.30],[-0.25,-1.15]],[[-0.70,-0.95],[-0.95,-0.35],[-0.90,0.35]],
 [[-0.85,1.05],[-0.45,1.55],[0.05,1.95]],[[0.55,2.35],[1.05,2.60],[1.05,3.20]],
 [[1.05,3.85],[0.50,4.25],[-0.10,4.25]],[[-0.75,4.25],[-1.08,3.80],[-1.08,3.20]],
 [[-1.08,2.62],[-0.72,2.28],[-0.25,2.30]],[[0.20,2.30],[0.55,2.60],[0.55,3.00]],
 [[0.55,3.40],[0.38,3.22],[0.10,3.16]]];

function drawScore(cv,pcs,meta){
  const S=11, W=1160, LEFT=96, RIGHT=40, GAP=31, SYS=132;
  const items=pcs.map((p,i)=>({pc:p,midi:0,i}));
  const mel=voice(pcs); mel.forEach((m,i)=>items[i].midi=m);
  const brk=new Set([11,12]);
  for(let i=13;i<pcs.length;i+=meta.blk) brk.add(i+meta.blk-1);

  const per=Math.floor((W-LEFT-RIGHT)/GAP);
  const rows=[]; let cur=[];
  items.forEach((it,i)=>{cur.push(it); if(cur.length===per||i===items.length-1){rows.push(cur);cur=[];}});
  const head=meta.legend?150:118;
  const H=head+rows.length*SYS+36;

  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const c=cv.getContext('2d'); c.scale(dpr,dpr);
  c.fillStyle='#0A0C11'; c.fillRect(0,0,W,H);

  c.fillStyle='#EDE4D2'; c.textBaseline='alphabetic';
  c.font='700 30px "Shippori Mincho B1",serif';
  c.fillText('噪律暗号',48,60);
  c.fillStyle='#7C8496'; c.font='400 12px "DM Mono",monospace';
  c.fillText(`様式 ${meta.style}  ／  ${pcs.length} 音  ／  区切り ${meta.blk} 音`,48,84);
  if(meta.legend){
    c.fillStyle='#8E7228'; c.font='400 12px "Zen Kaku Gothic New",sans-serif';
    c.fillText('先頭12音が鍵表(数字0〜11の対応)、13音目が様式、以降は区切りごとに末尾1音が検査音。',48,110);
  }

  const clef=(x,top)=>{
    c.save(); c.translate(x,top); c.scale(S,S);
    c.beginPath(); c.moveTo(CLEF[0][0],CLEF[0][1]);
    for(let k=1;k<CLEF.length;k++){const s=CLEF[k];
      c.bezierCurveTo(s[0][0],s[0][1],s[1][0],s[1][1],s[2][0],s[2][1]);}
    c.restore();
    c.strokeStyle='#EDE4D2'; c.lineWidth=0.22*S; c.lineCap='round'; c.lineJoin='round';
    c.stroke();
  };
  const sharp=(x,y)=>{
    c.strokeStyle='#C8B89A'; c.lineWidth=1.1;
    c.beginPath();
    c.moveTo(x-1.6,y-3.6); c.lineTo(x-1.6,y+3.0);
    c.moveTo(x+1.6,y-4.2); c.lineTo(x+1.6,y+2.4);
    c.stroke();
    c.lineWidth=2.0;
    c.beginPath();
    c.moveTo(x-3.4,y-0.6); c.lineTo(x+3.4,y-1.9);
    c.moveTo(x-3.4,y+2.3); c.lineTo(x+3.4,y+1.0);
    c.stroke();
  };

  rows.forEach((rw,ri)=>{
    const top=head+ri*SYS;
    const endX=LEFT+(rw.length-1)*GAP+16+GAP/2+6;
    c.strokeStyle='#39415A'; c.lineWidth=1;
    for(let k=0;k<5;k++){
      c.beginPath(); c.moveTo(48,top+k*S+.5); c.lineTo(endX,top+k*S+.5); c.stroke();
    }
    c.beginPath(); c.moveTo(endX-.5,top); c.lineTo(endX-.5,top+4*S); c.stroke();
    clef(70,top);
    rw.forEach((it,ci)=>{
      const x=LEFT+ci*GAP+16;
      const d=Math.floor(it.midi/12-1)*7+STEP[it.pc];
      const y=top+(38-d)*S/2;
      const ry=y-top;
      c.strokeStyle='#8A93A8'; c.lineWidth=1.2;
      for(let ly=5*S;ly<=ry+0.1;ly+=S){c.beginPath();c.moveTo(x-9,top+ly+.5);c.lineTo(x+9,top+ly+.5);c.stroke();}
      for(let ly=-S;ly>=ry-0.1;ly-=S){c.beginPath();c.moveTo(x-9,top+ly+.5);c.lineTo(x+9,top+ly+.5);c.stroke();}
      const hdr=it.i<13;
      c.save(); c.translate(x,y); c.rotate(-0.33);
      c.fillStyle=hdr?'#C8A23C':'#EDE4D2';
      c.beginPath(); c.ellipse(0,0,6.6,4.8,0,0,7); c.fill(); c.restore();
      c.strokeStyle=hdr?'#C8A23C':'#EDE4D2'; c.lineWidth=1.5;
      const up=y>top+2*S;
      c.beginPath();
      if(up){c.moveTo(x+6.2,y-1);c.lineTo(x+6.2,y-34);}else{c.moveTo(x-6.2,y+1);c.lineTo(x-6.2,y+34);}
      c.stroke();
      if(SHARP[it.pc]) sharp(x-15,y);
      if(brk.has(it.i)&&ci<rw.length-1){
        c.strokeStyle='#5A6480'; c.lineWidth=1;
        c.beginPath(); c.moveTo(x+GAP/2+4,top-2); c.lineTo(x+GAP/2+4,top+4*S+2); c.stroke();
      }
    });
    c.fillStyle='#39415A'; c.font='400 10px "DM Mono",monospace';
    c.fillText(String(ri+1).padStart(2,'0'),48,top-10);
  });
  return cv;
}

/* ══════════════════ 画面 ══════════════════ */
const $=id=>document.getElementById(id);
let cur=null, actx=null, srcNode=null, rafId=0;

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on','p-'+t.id.slice(2)===p.id));
});
$('tempo').oninput=e=>$('tempoV').textContent=(+e.target.value).toFixed(1);
$('reroll').onclick=()=>{row=makeRow();drawRing();
  say('encMsg','鍵表を引き直しました。もう一度「奏でる」を押してください。',true);};

function say(id,t,ok){const e=$(id);e.textContent=t;e.className='msg on'+(ok?' ok':'');}
function hush(id){$(id).className='msg';}
function dl(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}

$('go').onclick=async()=>{
  hush('encMsg');
  const text=$('src').value;
  if(!text){say('encMsg','本文が空です。文を書いてから押してください。');return;}
  let r;
  try{ r=encode(text,row,null,true); }
  catch(e){ say('encMsg',e.message); return; }
  const nps=+$('tempo').value, inst=$('inst').value;
  $('go').disabled=true; $('go').textContent='奏でています…';
  try{
    const mel=voice(r.pcs);
    const buf=await render(mel,inst,nps);
    cur={...r,mel,buf,nps,text};
    $('sNotes').textContent=r.pcs.length;
    $('sStyle').textContent=r.style===0?'0 — UTF-16':'1 — 6桁';
    $('sBlk').textContent=r.blk+' 音';
    $('sDens').textContent=(buf.length/buf.sampleRate).toFixed(1)+' 秒';
    $('out').classList.add('on');
    fillNames(r); drawScore($('score'),r.pcs,{...r,legend:$('legend').checked});
    $('out').scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){ say('encMsg','音を作れませんでした。'+e.message); }
  $('go').disabled=false; $('go').textContent='奏でる';
};

let nameMode='ja';
function oneLine(){ return cur ? cur.pcs.map(p=>(nameMode==='ja'?JA:EN)[p]).join(' ') : ''; }
function syncLine(){
  $('oneline').value=oneLine();
  $('swKana').setAttribute('aria-pressed',nameMode==='ja');
  $('swEn').setAttribute('aria-pressed',nameMode==='en');
}
$('swKana').onclick=()=>{nameMode='ja';syncLine();};
$('swEn').onclick=()=>{nameMode='en';syncLine();};
$('copyLine').onclick=async()=>{
  const el=$('oneline'); const txt=el.value;
  if(!txt) return;
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }catch(_){
    el.removeAttribute('readonly'); el.select(); el.setSelectionRange(0,txt.length);
    try{ ok=document.execCommand('copy'); }catch(__){}
    el.setAttribute('readonly','');
  }
  if(ok){ const c=$('copied'); c.classList.add('on'); setTimeout(()=>c.classList.remove('on'),1600); }
  else{ el.select(); }
};

function fillNames(r){
  const mk=(el,arr,cls,off)=>{
    $(el).innerHTML=arr.map((p,i)=>`<span class="nn ${cls}">${JA[p]}</span>`).join('');
  };
  syncLine();
  mk('nlRow',r.pcs.slice(0,12),'hd');
  mk('nlStyle',r.pcs.slice(12,13),'st');
  $('nlBody').innerHTML=r.pcs.slice(13).map((p,i)=>{
    const last=(i+1)%r.blk===0;
    return `<span class="nn${last?' st':''}">${JA[p]}</span>`+(last?'<span style="flex-basis:100%;height:6px"></span>':'');
  }).join('');
}

$('play').onclick=()=>{
  if(!cur) return;
  if(srcNode){stop();return;}
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  actx.resume();
  srcNode=actx.createBufferSource(); srcNode.buffer=cur.buf;
  srcNode.connect(actx.destination);
  const t0=actx.currentTime;
  srcNode.start(); $('play').textContent='止める';
  srcNode.onended=stop;
  const tick=()=>{
    const i=Math.floor((actx.currentTime-t0-0.05)*cur.nps);
    if(i>=0&&i<cur.pcs.length) litRing(cur.pcs[i]);
    rafId=requestAnimationFrame(tick);
  };
  tick();
};
function stop(){
  if(srcNode){try{srcNode.stop()}catch(_){} srcNode=null;}
  cancelAnimationFrame(rafId); litRing(-1); $('play').textContent='聴く';
}

$('dlAudio').onclick=()=>{
  if(!cur) return;
  const m=mp3Blob(cur.buf);
  if(m) dl(m,'souritsu.mp3');
  else { dl(wavBlob(cur.buf),'souritsu.wav');
         say('encMsg','MP3 の変換器を読み込めなかったので WAV で書き出しました。',true); }
};
$('dlScore').onclick=()=>$('score').toBlob(b=>dl(b,'souritsu.png'));
$('legend').onchange=()=>{ if(cur) drawScore($('score'),cur.pcs,{...cur,legend:$('legend').checked}); };

const toggle=(btn,drw)=>$(btn).onclick=()=>{
  const d=$(drw), on=!d.classList.contains('on');
  d.classList.toggle('on',on); $(btn).setAttribute('aria-pressed',on);
};
toggle('bScore','dScore'); toggle('bNames','dNames');

$('dgo').onclick=()=>{
  hush('decMsg'); $('dres').classList.remove('on');
  try{
    const pcs=parseNotes($('dsrc').value);
    const t=decode(pcs,true);
    $('dres').textContent=t||'(空の本文です)';
    $('dres').classList.add('on');
    say('decMsg',`${pcs.length} 音を読み解きました。`,true);
  }catch(e){ say('decMsg',e.message); }
};
