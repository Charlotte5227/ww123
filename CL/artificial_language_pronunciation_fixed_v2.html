<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111a31">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 font-size=%2252%22>ɨ</text></svg>">
  <title>人工言語 発音支援</title>
  <meta name="description" content="人工言語のIPA変換、音素解説、近似読み上げ">
  <style>
    :root{color-scheme:dark;--bg:#09101f;--panel:#111a31;--panel2:#17213d;--ink:#eef3ff;--muted:#aab6d4;--line:#2b385d;--blue:#75a7ff;--green:#58d6a5;--violet:#bd8cff;--orange:#ffb45f;--red:#ff7e8b;--shadow:0 18px 50px #02061166}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#172750 0,transparent 32rem),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;font-size:16px;line-height:1.65}
    button,textarea{font:inherit}.shell{width:min(1080px,100%);margin:auto;padding:32px 18px 72px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.top h1{font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.15;margin:4px 0}.legend{color:var(--muted);font-size:.88rem}.panel{background:linear-gradient(145deg,#131d36e8,#0f172be8);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-top:16px}textarea{width:100%;min-height:125px;resize:vertical;background:#080f20;color:var(--ink);border:1px solid #34466f;border-radius:14px;padding:15px;outline:none}textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #75a7ff25}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.btn{min-height:46px;border:0;border-radius:12px;padding:10px 17px;font-weight:750;cursor:pointer;color:#07101f;background:var(--blue)}.btn.secondary{background:#243252;color:var(--ink);border:1px solid #3b4b73}.btn:active{transform:translateY(1px)}.note{margin:13px 0 0;color:var(--muted);font-size:.9rem}.result-label,.section-title{font-size:.8rem;font-weight:800;letter-spacing:.1em;color:var(--muted)}.ipa{font-family:"Noto Sans",Arial,sans-serif;font-size:clamp(1.65rem,6vw,3.1rem);letter-spacing:.035em;margin-top:7px;overflow-wrap:anywhere}.dropped{color:#6c7896;font-size:.75em}.words{display:grid;gap:18px;margin-top:15px}.word-title{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;margin-bottom:8px}.cards{display:flex;align-items:stretch;flex-wrap:wrap;gap:8px}.phoneme{min-width:60px;border:1px solid currentColor;border-radius:11px;padding:7px 9px;background:#14203b;color:var(--blue);cursor:pointer;text-align:center}.phoneme.vowel{color:var(--green)}.phoneme.rhotic{color:var(--violet)}.phoneme.cut{color:var(--orange)}.phoneme .sp{font:700 .76rem ui-monospace,monospace}.phoneme .ip{font-size:1.2rem}.boundary{width:1px;background:#7180a6;margin:2px 4px;position:relative}.boundary:after{content:"_";position:absolute;top:100%;left:-4px;color:#7180a6;font-size:.75rem}.hard-list{display:grid;gap:10px;margin-top:12px}.tip{padding:13px 14px;border-left:3px solid var(--orange);background:#151f38;border-radius:4px 12px 12px 4px}.tip strong{display:block;color:#ffd39f}.empty{color:var(--muted)}dialog{max-width:min(520px,calc(100% - 28px));border:1px solid #45577f;border-radius:18px;background:#111a31;color:var(--ink);padding:22px;box-shadow:var(--shadow)}dialog::backdrop{background:#020611b8}.modal-head{font-size:1.25rem;font-weight:800}.modal-ipa{font-size:2.2rem;color:var(--blue);margin:4px 0}.diagnostics{display:none}.diagnostics.open{display:block}.diag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0}.metric{background:#0a1122;border:1px solid var(--line);border-radius:11px;padding:10px 12px}.metric span{display:block;color:var(--muted);font-size:.76rem}.status{border-radius:12px;padding:12px 14px;background:#0a1122;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.status[data-tone="ok"]{border-color:#327e68}.status[data-tone="error"]{border-color:#963e4b}.voice-list{margin:10px 0 0;padding-left:21px;color:var(--muted);max-height:160px;overflow:auto;font-size:.88rem}.test-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.mini{min-height:40px;padding:8px 12px}.footer{color:var(--muted);font-size:.85rem;margin-top:24px;text-align:center}@media(max-width:680px){.shell{padding:20px 12px 55px}.top{align-items:start;flex-direction:column}.panel{padding:15px;border-radius:16px}.diag-grid{grid-template-columns:1fr}.btn{flex:1}.actions .secondary{flex:0 1 auto}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div><div class="eyebrow">Pronunciation Workbench</div><h1>人工言語 発音支援</h1></div><div class="legend">音は近似、解説は正確</div></header>
  <section class="panel">
    <label class="section-title" for="source">ラテン文字表記</label>
    <textarea id="source" spellcheck="false">phiuq_xash tsuq_hwa fwer futh_wel</textarea>
    <div class="actions"><button class="btn" id="convert">IPAに変換</button><button class="btn secondary" id="speak">▶ 読み上げ</button><button class="btn secondary" id="toggleDiag" aria-expanded="false">音声を診断</button></div>
    <p class="note">音声は近似です。有気音・R音性母音・切る母音は正確に再現されません。正確な発音は解説を参照してください。</p>
  </section>
  <section class="panel diagnostics" id="diagnostics">
    <div class="section-title">スマホ音声診断</div>
    <div class="diag-grid"><div class="metric"><span>Web Speech API</span><b id="apiState">確認中</b></div><div class="metric"><span>取得済み音声</span><b id="voiceCount">0</b></div><div class="metric"><span>日本語音声</span><b id="jaVoice">未取得</b></div><div class="metric"><span>中国語音声</span><b id="zhVoice">未取得</b></div></div>
    <div class="test-actions"><button class="btn secondary mini" data-test="ja-JP" data-text="こんにちは">日本語テスト</button><button class="btn secondary mini" data-test="zh-CN" data-text="你好">中国語テスト</button><button class="btn secondary mini" data-test="" data-text="音声テスト">OS既定テスト</button><button class="btn secondary mini" id="reloadVoices">音声一覧を再取得</button></div>
    <div class="status" id="speechStatus">まだ発話していません。</div><ul class="voice-list" id="voiceList"></ul>
  </section>
  <section class="panel"><div class="result-label">IPA変換結果</div><div class="ipa" id="ipa" aria-live="polite"></div></section>
  <section class="panel"><div class="section-title">音素の分解</div><div class="words" id="breakdown"></div></section>
  <section class="panel"><div class="section-title">この文に含まれる難音</div><div class="hard-list" id="hard"></div></section>
  <div class="footer">音素カードを押すと発音方法を確認できます。</div>
</main>
<dialog id="detail"><div class="modal-head" id="detailSpell"></div><div class="modal-ipa" id="detailIpa"></div><p id="detailText"></p><form method="dialog"><button class="btn">閉じる</button></form></dialog>
<script>
(()=>{'use strict';
const C={ph:['pʰ','有気の p'],th:['tʰ','有気の t'],kh:['kʰ','有気の k'],ts:['ts','日本語の「ツ」の子音。語頭にも立ちます。'],ch:['tɕ','日本語の「チ」の子音です。'],sh:['ɕ','日本語の「シ」の子音。英語の sh より舌が前です。'],ny:['ɲ','日本語の「ニャ」の子音です。'],ng:['ŋ','ガ行鼻濁音のような音。語頭にも立つのが特徴です。'],p:['p','日本語のパ行の子音。息を強く出しません。'],t:['t','日本語のタ行の子音。息を強く出しません。'],k:['k','日本語のカ行の子音。息を強く出しません。'],f:['ɸ','日本語の「フ」の子音。上下の唇で作り、英語の f とは異なります。'],s:['s','日本語のサ行の子音です。'],h:['x','「カ」の舌の位置のまま息を流す、喉の摩擦音です。日本語の「ハ」ではありません。'],m:['m','日本語とほぼ同じです。'],n:['n','日本語とほぼ同じです。'],w:['w','日本語の「ワ」の子音です。'],l:['l','舌先を歯茎につけたまま声を出します。日本語のラ行ではありません。'],y:['j','日本語の「ヤ」の子音です。']};
const V={iu:['ɨ','vowel','「イ」と「ウ」の中間。舌を口の中央に置きます。'],eo:['ə','vowel','力を抜いた曖昧な音。英語 about の a に近い音です。'],ar:['ɑ˞','rhotic','「ア」を発音しながら舌先を持ち上げ、後ろへ反らせます。'],er:['ɚ','rhotic','母音を発音しながら舌先を後ろへ反らせます。'],ir:['ɚ̈','rhotic','「イ」寄りの母音を発音しながら舌先を後ろへ反らせます。'],ur:['ɚ̈','rhotic','ir と同じ音です。舌先を後ろへ反らせます。'],or:['ɔ˞','rhotic','「オ」を発音しながら舌先を後ろへ反らせます。'],aq:['aʔ','cut','「あっ」のように喉を閉じて音を止めます。'],iq:['iʔ','cut','「いっ」のように喉を閉じて音を止めます。'],uq:['ɯʔ','cut','「うっ」のように喉を閉じて音を止めます。'],eq:['eʔ','cut','「えっ」のように喉を閉じて音を止めます。'],a:['a','vowel','日本語の「ア」とほぼ同じです。'],i:['i','vowel','日本語の「イ」とほぼ同じです。'],u:['ɯ','vowel','日本語の「ウ」に近く、唇を丸めません。'],e:['e','vowel','日本語の「エ」とほぼ同じです。'],o:['o','vowel','日本語の「オ」とほぼ同じです。']};
const SPECIAL={laer:'lɑ˞',nyaer:'ɲɑ˞',war:'wɑ˞',phiuq:'pʰɨʔ',hiuq:'xɨʔ',pheulng:'pʰɨlŋ',pheus:'pʰɨs',ngeolm:'ŋəlm',mweol:'mwəl',nguer:'ŋɚ',theuq:'tʰəʔ',kiur:'kɨɚ'};
const ckeys=Object.keys(C).sort((a,b)=>b.length-a.length),vkeys=Object.keys(V).sort((a,b)=>b.length-a.length);
const $=id=>document.getElementById(id),source=$('source'),ipa=$('ipa'),breakdown=$('breakdown'),hard=$('hard');
function esc(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function tokenize(raw){const out=[];let i=0;while(i<raw.length){const c=raw[i];if(c==='_'){out.push({type:'boundary',spell:'_'});i++;continue}if(/\s/.test(c)){out.push({type:'space',spell:c});i++;continue}if(/[.,-]/.test(c)){out.push({type:'pause',spell:c});i++;continue}let key=ckeys.find(k=>raw.startsWith(k,i));if(key){out.push({type:'consonant',spell:key,ipa:C[key][0],desc:C[key][1]});i+=key.length;continue}key=vkeys.find(k=>raw.startsWith(k,i));if(key){const v=V[key];out.push({type:v[1],spell:key,ipa:v[0],desc:v[2],cut:v[1]==='cut'});i+=key.length;continue}out.push({type:'unknown',spell:c,ipa:c,desc:'音素表にない文字です。'});i++}return out}
function groups(raw){return raw.trim().split(/(\s+|[.,-])/).filter(Boolean).map(s=>({raw:s,tokens:/^(\s+|[.,-])$/.test(s)?[{type:/\s/.test(s)?'space':'pause',spell:s}]:tokenize(s)}))}
function weaken(tokens){return tokens.map((t,i)=>{if(!t.cut)return t;const boundary=tokens.slice(i+1).some(x=>x.type==='boundary');if(boundary){return {...t,display:t.ipa.replace('ʔ','<span class="dropped">(ʔ)</span>'),spoken:t.ipa.replace('ʔ',''),dropped:true}}return {...t,display:t.ipa,spoken:t.ipa}})}
function render(){const gs=groups(source.value.toLowerCase());ipa.innerHTML='';breakdown.innerHTML='';const found=new Set();gs.forEach(g=>{if(g.tokens[0].type==='space'){ipa.append(document.createTextNode('  '));return}if(g.tokens[0].type==='pause'){ipa.append(document.createTextNode(g.raw==='-'?' — ':g.raw+' '));return}const ts=weaken(g.tokens);const compact=g.raw.replaceAll('_','');let shown=ts.map(t=>t.display??t.ipa??'').join('');if(SPECIAL[compact]&&!ts.some(t=>t.dropped))shown=SPECIAL[compact];ipa.insertAdjacentHTML('beforeend',shown+' ');const block=document.createElement('div');block.innerHTML='<div class="word-title">'+esc(g.raw)+'</div>';const cards=document.createElement('div');cards.className='cards';ts.forEach(t=>{if(t.type==='boundary'){const b=document.createElement('span');b.className='boundary';cards.append(b);return}if(!t.ipa)return;const b=document.createElement('button');b.className='phoneme '+(t.type==='consonant'?'':t.type);b.innerHTML='<div class="sp">'+esc(t.spell)+'</div><div class="ip">'+(t.display??esc(t.ipa))+'</div>';b.onclick=()=>showDetail(t);cards.append(b);if(['ph','th','kh'].includes(t.spell))found.add('asp');if(t.spell==='h')found.add('x');if(t.type==='rhotic')found.add('r');if(t.type==='cut')found.add('cut')});block.append(cards);breakdown.append(block)});renderHard(found);return gs}
function showDetail(t){$('detailSpell').textContent=t.spell;$('detailIpa').textContent=t.ipa;$('detailText').textContent=t.desc;$('detail').showModal()}
const tips={asp:['有気音','「パ」「タ」「カ」を言いながら手のひらを口の前へ。息が強く当たるよう、意識的に息を吐き出します。'],x:['x（綴り h）','「カ」の舌の位置のまま息を流し続けます。日本語の「ハ」ではありません。'],r:['R音性母音','母音を発音しながら舌先を持ち上げ、後ろへ反らせます。英語 bird や中国語の儿化に近い音です。'],cut:['切る母音','日本語の「あっ」の「っ」と同じく喉を閉じます。語末では切れ、接辞が続くと声門閉鎖が消えます。']};
function renderHard(found){hard.innerHTML='';if(!found.size){hard.innerHTML='<div class="empty">特に難しい音は含まれていません。</div>';return}found.forEach(k=>{const [a,b]=tips[k];hard.insertAdjacentHTML('beforeend','<div class="tip"><strong>'+a+'</strong>'+b+'</div>')})}
function toTts(){return source.value.toLowerCase().replaceAll('_','').replace(/ph/g,'p').replace(/th/g,'t').replace(/kh/g,'k').replace(/ch/g,'q').replace(/sh/g,'x').replace(/ny/g,'ni').replace(/ng/g,'en').replace(/ts/g,'c').replace(/iu/g,'yi').replace(/eo/g,'e').replace(/([aiueo])q/g,'$1，').replace(/ar/g,'ar').replace(/er/g,'er').replace(/ir|ur/g,'ir').replace(/or/g,'or').replace(/f/g,'f').replace(/h/g,'h').replace(/y/g,'y').replace(/\s+/g,'，')}
let voices=[],activeUtterance=null,watchdog=0;
function refreshVoices(){if(!('speechSynthesis'in window)){updateDiag();return}voices=speechSynthesis.getVoices()||[];updateDiag()}
function pick(lang){const stem=lang.toLowerCase().split('-')[0];return voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(stem))||null}
function updateDiag(){const supported='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;$('apiState').textContent=supported?'対応':'非対応';$('voiceCount').textContent=voices.length+'件';$('jaVoice').textContent=pick('ja-JP')?.name||'なし';$('zhVoice').textContent=pick('zh-CN')?.name||'なし';$('voiceList').innerHTML=voices.length?voices.map(v=>'<li>'+esc(v.name)+' — '+esc(v.lang)+(v.default?'（既定）':'')+'</li>').join(''):'<li>一覧は空です。OS既定音声による発話は試せます。</li>'}
function status(text,tone=''){$('speechStatus').textContent=text;$('speechStatus').dataset.tone=tone}
function speakNow(text,lang,mode){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){status('Web Speech APIがありません。別のブラウザでお試しください。','error');return}clearTimeout(watchdog);const u=new SpeechSynthesisUtterance(text);activeUtterance=u;if(lang)u.lang=lang;const voice=lang?pick(lang):null;if(voice)u.voice=voice;u.rate=.8;u.volume=1;const info='送信内容: '+text+'\n言語: '+(lang||'OS既定')+'\n音声: '+(voice?.name||'明示指定なし');status('発話要求を送信しました。\n'+info);u.onstart=()=>status('発話を開始しました。\n'+info,'ok');u.onend=()=>{status('発話を終了しました。\n'+info,'ok');activeUtterance=null};u.onerror=e=>{status('発話エラー: '+(e.error||'不明')+'\n'+info,'error');activeUtterance=null};speechSynthesis.resume();speechSynthesis.speak(u);watchdog=setTimeout(()=>{if(activeUtterance===u)status('10秒以内に開始イベントが届きませんでした。\nブラウザまたはOSの音声合成が発話要求を保留しています。\n'+info,'error')},10000)}
function mainSpeak(){render();const zh=pick('zh-CN'),ja=pick('ja-JP');if(zh)speakNow(toTts(),'zh-CN','main');else if(ja)speakNow(source.value.replaceAll('_',''),'ja-JP','main');else speakNow(source.value.replaceAll('_',''),'','main')}
$('convert').onclick=render;$('speak').onclick=mainSpeak;$('toggleDiag').onclick=()=>{const p=$('diagnostics'),open=!p.classList.contains('open');p.classList.toggle('open',open);$('toggleDiag').setAttribute('aria-expanded',open);if(open)refreshVoices()};document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>speakNow(b.dataset.text,b.dataset.test,'test'));$('reloadVoices').onclick=refreshVoices;
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=refreshVoices;refreshVoices();setTimeout(refreshVoices,250);setTimeout(refreshVoices,1000)}else updateDiag();
render();
})();
</script>
</body>
</html>
