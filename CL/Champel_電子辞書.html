:root{
  --paper:#E9EAE4; --panel:#F3F4EF; --ink:#171A16; --dim:#6A7066;
  --rule:#C4C9BD; --mark:#7A2E1E; --cls:#2F5D57; --deep:#232722;
  --bar:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.ch{font-family:Champel; font-feature-settings:"liga" 1}

/* ---------- 検索バー ---------- */
#bar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:stretch; height:var(--bar);
  background:var(--paper); border-bottom:2px solid var(--ink);
}
#menu{
  width:56px; flex:0 0 56px; border:0; border-right:1px solid var(--rule);
  background:none; cursor:pointer; display:grid; place-items:center; padding:0;
}
#menu span{display:block; width:20px; height:1.5px; background:var(--ink); margin:3px 0}
#menu:focus-visible{outline:2px solid var(--mark); outline-offset:-3px}
#field{flex:1; display:flex; align-items:center; gap:10px; padding:0 14px; min-width:0}
#q{
  flex:1; min-width:0; font:17px/1.4 inherit; border:0; background:none;
  color:var(--ink); padding:0;
}
#q:focus{outline:none}
#q::placeholder{color:var(--dim)}
#peek{font-family:Champel; font-size:26px; color:var(--dim); white-space:nowrap;
  max-width:38%; overflow:hidden}
#clear{border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer;
  padding:4px 2px; line-height:1; display:none}
#clear:focus-visible{outline:2px solid var(--mark)}

/* ---------- 状態行 ---------- */
#state{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:9px 18px; font-size:12px; color:var(--dim);
  border-bottom:1px solid var(--rule);
}
#state b{color:var(--ink); font-weight:600; font-size:13px}
#state .tag{
  color:var(--mark); border:1px solid var(--mark); border-radius:2px;
  padding:1px 7px; font-size:11px;
}
#state button{
  border:0; background:none; color:var(--dim); font:inherit; font-size:11px;
  text-decoration:underline; cursor:pointer; padding:0;
}

/* ---------- 一覧 ---------- */
#list{padding:0 0 5rem}
.ent{
  display:block; width:100%; text-align:left; background:none; cursor:pointer;
  border:0; border-bottom:1px solid var(--rule); padding:11px 18px 10px;
  font:inherit; color:inherit;
}
.ent:hover{background:var(--panel)}
.ent:focus-visible{outline:2px solid var(--mark); outline-offset:-2px}
.ent .top{display:flex; align-items:baseline; gap:9px}
.ent .w{font:15px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.01em}
.ent .j{flex:1; min-width:0}
.ent .c{color:var(--cls); font:11px ui-monospace,Menlo,monospace; white-space:nowrap}
.ent .g{display:block; font-family:Champel; font-size:25px; line-height:1.5;
  margin-top:2px; word-break:break-all}
.ent .m{display:block; font-size:11px; color:var(--dim); margin-top:1px}
.ent .n{
  display:none; margin-top:8px; padding:8px 11px; background:var(--panel);
  border-left:2px solid var(--mark); font-size:13px; line-height:1.7;
}
.ent[aria-expanded=true] .n{display:block}
.ent[aria-expanded=true]{background:var(--panel)}
mark{background:none; color:var(--mark); font-weight:600}
#none{padding:40px 18px; color:var(--dim); font-size:14px}
#none b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px}

/* ---------- 引き出し ---------- */
#veil{
  position:fixed; inset:0; z-index:50; background:rgba(23,26,22,.42);
  opacity:0; pointer-events:none; transition:opacity .18s;
}
#veil.on{opacity:1; pointer-events:auto}
#draw{
  position:fixed; top:0; left:0; bottom:0; z-index:60; width:min(300px,84vw);
  background:var(--deep); color:#E9EAE4; overflow-y:auto;
  transform:translateX(-100%); transition:transform .2s cubic-bezier(.4,0,.2,1);
  padding-bottom:2rem;
}
#draw.on{transform:none}
@media(prefers-reduced-motion:reduce){#draw,#veil{transition:none}}
#draw h2{
  font-size:12px; font-weight:600; letter-spacing:.14em; color:#9AA396;
  margin:22px 0 4px; padding:0 18px;
}
#draw h2:first-of-type{margin-top:18px}
#draw .close{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  height:var(--bar); padding:0 18px; background:none; border:0;
  border-bottom:1px solid #3A4038; color:#E9EAE4; font:inherit; cursor:pointer;
}
#draw .close span{font-size:20px; line-height:1}
#draw .f{
  display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
  background:none; border:0; border-left:3px solid transparent;
  color:#D6DBD2; font:inherit; font-size:14px; padding:7px 18px 7px 15px;
  cursor:pointer;
}
#draw .f:hover{background:#2C312B}
#draw .f:focus-visible{outline:2px solid var(--mark); outline-offset:-2px}
#draw .f.on{border-left-color:var(--mark); color:#fff; background:#2C312B}
#draw .f i{font-style:normal; color:#7E8779; font-size:11px; margin-left:auto}
</style>

olm(家)+ _ar"},{"w":"sholmorn","ipa":"ɕolmɔ˞n","j":"学校","c":"_ar","cat":"場所","n":"sholm(教える)+ -orn"},{"w":"ngiuqorn","ipa":"ŋɨʔɔ˞n","j":"教会","c":"_ar","cat":"場所","n":"ngiuq(神)+ -orn"},{"w":"palntem","ipa":"palntem","j":"鎧","c":"_ish","cat":"道具","n":"paln(守る)+ -tem"},{"w":"sefntem","ipa":"seɸntem","j":"剣","c":"_ish","cat":"道具","n":"sef(切る)+ -tem。seftem(刃物)と同源の別形"},{"w":"palnngam","ipa":"palnŋam","j":"騎士","c":"","cat":"職業","n":"paln(守る)+ -ngam"},{"w":"sholmngam","ipa":"ɕolmŋam","j":"先生","c":"","cat":"職業","n":"sholm(教える)+ -ngam"},{"w":"siorfngam","ipa":"siɔ˞ɸŋam","j":"漁師","c":"","cat":"職業","n":"siorf(釣る)+ -ngam"},{"w":"-ngam","ipa":"ŋam","j":"職業（〜する人）","c":"","cat":"接尾辞","n":"ngar chalm の摩耗。人名 -nga/-na と同源の別経路"},{"w":"Entiria","ipa":"entiria","j":"エンディリア（身分）","c":"","cat":"借用語","n":"語頭が母音。Champel の語根にない形"},{"w":"ngeq","ipa":"ŋeʔ","j":"行為者を示す","c":"","cat":"助詞・格","n":"任意。無生名詞が主語のときに現れる（示差的主語標示）"},{"w":"thur","ipa":"tʰɚ̈","j":"受け手を示す","c":"","cat":"助詞・格","n":"任意。名詞の前に置く"},{"w":"shiu","ipa":"ɕɨ","j":"所有・所属","c":"","cat":"助詞・格","n":"常時。A shiu B = AのB"},{"w":"war","ipa":"wɑ˞","j":"場所・方向・時","c":"","cat":"助詞・遮断","n":"時間を遮断する。奪格も war + 位置関係名詞で表す"},{"w":"wilt","ipa":"wilt","j":"〜だけ","c":"","cat":"助詞・遮断","n":"時間を遮断する。war と語頭 w- を共有"},{"w":"ngaq","ipa":"ŋaʔ","j":"否定","c":"","cat":"助詞・作用素","n":"動詞接頭辞にもなる。融合して khang / ngangl / ngangeq を作る"},{"w":"niq","ipa":"niʔ","j":"並列・連結","c":"","cat":"助詞・並列","n":"**中置**（A niq B）。前置に転じなかった唯一の助詞"},{"w":"_ish","ipa":"iɕ","j":"形あり・持てる","c":"","cat":"名詞クラス","n":"人間名詞に付けると侮辱"},{"w":"_alng","ipa":"alŋ","j":"形あり・持てない","c":"","cat":"名詞クラス","n":"声・視線・疲れなど、身体から出るもの"},{"w":"_eq","ipa":"eʔ","j":"形なし・抽象","c":"","cat":"名詞クラス","n":"状態動詞や節の名詞化にも使う"},{"w":"_urf","ipa":"ɚ̈ɸ","j":"感情","c":"","cat":"名詞クラス","n":"拒否を感情の範疇に置くと交渉の対象から外れる"},{"w":"_shash","ipa":"ɕaɕ","j":"過去","c":"","cat":"名詞クラス","n":"実質名詞に付くと動詞に時間が流れる"},{"w":"_nos","ipa":"nos","j":"現在","c":"","cat":"名詞クラス","n":""},{"w":"_thiuk","ipa":"tʰɨk","j":"未来","c":"","cat":"名詞クラス","n":""},{"w":"_ar","ipa":"ɑ˞","j":"場所","c":"","cat":"名詞クラス","n":""},{"w":"_ngeol","ipa":"ŋəl","j":"神・聖なるもの","c":"","cat":"名詞クラス","n":"一人称に付けると不遜の極み"},{"w":"khaq_","ipa":"kʰaʔ","j":"疑問（動詞接頭辞）","c":"","cat":"動詞接辞","n":"最外層。VOS語順なら疑問、OSVなら推量"},{"w":"ngaq_","ipa":"ŋaʔ","j":"否定（動詞接頭辞）","c":"","cat":"動詞接辞","n":"最外層。1文に1つだけ"},{"w":"khang_","ipa":"kʰaŋ","j":"否定疑問","c":"","cat":"動詞接辞","n":"khaq + ngaq の融合。応答は日本語型"},{"w":"sha_","ipa":"ɕa","j":"過去","c":"","cat":"動詞接辞","n":"phiuq_shash の摩耗形"},{"w":"no_","ipa":"no","j":"現在","c":"","cat":"動詞接辞","n":""},{"w":"thu_","ipa":"tʰɯ","j":"未来","c":"","cat":"動詞接辞","n":""},{"w":"chur_","ipa":"tɕɚ̈","j":"複数","c":"","cat":"動詞接辞","n":"名詞にも付く。人称では義務"},{"w":"_tsiq","ipa":"tsiʔ","j":"完了相","c":"","cat":"動詞接辞","n":"儀礼レジスターで多用。ngaq_ と組むと「まだ〜ない」"},{"w":"_wel","ipa":"wel","j":"継続相","c":"","cat":"動詞接辞","n":""},{"w":"_nyar","ipa":"ɲɑ˞","j":"習慣相","c":"","cat":"動詞接辞","n":""},{"w":"_hwa","ipa":"xwa","j":"副詞化","c":"","cat":"動詞接辞","n":"状態動詞を副詞にする。非言語的使役 V_hwa ngar にも使う"},{"w":"phiuq_shash","ipa":"pʰɨʔɕaɕ","j":"〜してから","c":"","cat":"接続","n":"摩耗形 sha_"},{"w":"phiuq_nos","ipa":"pʰɨʔnos","j":"〜しながら","c":"","cat":"接続","n":""},{"w":"hoq_shash","ipa":"xoʔɕaɕ","j":"〜だから","c":"","cat":"接続","n":"摩耗形 hosh"},{"w":"hoq_thiuk","ipa":"xoʔtʰɨk","j":"〜するために・〜しようとして","c":"","cat":"接続","n":"摩耗形 hothu。意図もこれで表す"},{"w":"nguer_eq","ipa":"ŋɚeʔ","j":"〜だが","c":"","cat":"接続","n":"逆接。譲歩には使えない"},{"w":"ngar_nos","ipa":"ŋɑ˞nos","j":"〜するほど","c":"","cat":"接続","n":"程度の相関"},{"w":"shal","ipa":"ɕal","j":"〜することで","c":"","cat":"接続","n":"shwel_alng の摩耗形"}];
const GROUPS = [["しくみ", ["助詞・格", "助詞・遮断", "助詞・作用素", "助詞・並列", "名詞クラス", "動詞接辞", "接続", "類別辞", "派生接尾辞", "接尾辞", "摩耗形", "使役の融合形", "薄い名詞"]], ["ひと", ["親族・人", "人称代名詞・簡略層", "人称代名詞・精密層", "対人・社会", "職業"]], ["からだ", ["頭部", "胴・四肢", "内部・生命", "感覚"]], ["しぜん", ["天体・地形", "物質", "天候", "動植物", "色"]], ["ばしょ・とき", ["位置関係", "方位", "季節", "一日の区分", "相対的な日", "時間・新旧", "場所", "道・移動"]], ["うごき", ["移動", "操作", "操作・移動", "姿勢・存在", "生死", "授受・所持・取引", "知覚・思考・言語", "探索・獲得", "労働・生産", "その他"]], ["ようす", ["大きさ・量", "評価", "状態・距離", "心的状態", "量・程度", "状態動詞"]], ["くらし", ["建物・空間", "容器・器具", "衣", "食・火", "道具", "物"]], ["かず・ことば", ["数詞", "単位", "抽象", "抽象的な物・単位", "応答", "挨拶", "感動詞", "慣用句"]], ["そのほか", ["複合語", "借用語"]]];
const $ = i => document.getElementById(i);
let cat = null;          // 選択中の分類。null なら全部

/* ---------- 引き出し ---------- */
const draw = $("draw"), veil = $("veil"), menu = $("menu");
function openDraw(on){
  draw.classList.toggle("on", on);
  veil.classList.toggle("on", on);
  draw.setAttribute("aria-hidden", String(!on));
  menu.setAttribute("aria-expanded", String(on));
  if(on) draw.querySelector(".close").focus(); else menu.focus();
}
menu.onclick = ()=>openDraw(true);
veil.onclick = ()=>openDraw(false);
draw.querySelector(".close").onclick = ()=>openDraw(false);
addEventListener("keydown", e=>{ if(e.key==="Escape" && draw.classList.contains("on")) openDraw(false); });

/* ---------- 絞り込みの中身 ---------- */
const count = {};
DICT.forEach(d=>count[d.cat]=(count[d.cat]||0)+1);
$("filters").innerHTML =
  `<button class="f on" data-c="">すべて<i>${DICT.length}</i></button>` +
  GROUPS.map(([g,cs])=>
    `<h2>${g}</h2>` + cs.map(c=>
      `<button class="f" data-c="${c}">${c}<i>${count[c]||0}</i></button>`).join("")
  ).join("");
$("filters").onclick = e=>{
  const b = e.target.closest(".f"); if(!b) return;
  cat = b.dataset.c || null;
  document.querySelectorAll("#draw .f").forEach(x=>x.classList.toggle("on", x===b));
  openDraw(false); draw.scrollTop = 0; render();
};

/* ---------- 検索 ---------- */
const q = $("q"), clear = $("clear"), peek = $("peek");
const norm = s => s.toLowerCase().replace(/_/g,"");
function hit(d, s){
  if(!s) return true;
  return norm(d.w).includes(s) || d.j.includes(s) || d.ipa.includes(s)
      || d.cat.includes(s) || (d.n||"").includes(s);
}
function mark(text, s){
  if(!s) return text;
  const i = text.toLowerCase().indexOf(s);
  if(i < 0) return text;
  return text.slice(0,i) + "<mark>" + text.slice(i,i+s.length) + "</mark>" + text.slice(i+s.length);
}

function render(){
  const raw = q.value.trim(), s = norm(raw);
  clear.style.display = raw ? "block" : "none";
  peek.textContent = /^[a-z_ -]+$/i.test(raw) ? raw.replace(/_/g,"") : "";

  let out = DICT.filter(d => (!cat || d.cat===cat) && hit(d, s));
  // 完全一致を先頭へ
  out.sort((a,b)=>{
    const ea = (norm(a.w)===s || a.j===raw) ? 0 : 1;
    const eb = (norm(b.w)===s || b.j===raw) ? 0 : 1;
    return ea-eb;
  });

  $("state").innerHTML =
    `<b>${out.length}</b><span>語</span>`
    + (cat ? `<span class="tag">${cat}</span><button id="off">絞り込みを外す</button>` : "")
    + (raw ? `<span>「${raw}」で検索</span>` : "");
  const off = $("off");
  if(off) off.onclick = ()=>{
    cat = null;
    document.querySelectorAll("#draw .f").forEach(x=>x.classList.toggle("on", !x.dataset.c));
    render();
  };

  if(!out.length){
    $("list").innerHTML =
      `<div id="none"><b>見つかりません</b>
       日本語・ローマ字・IPA・分類名のどれでも引けます。
       接辞は <code>_shash</code> のように下線つきでも、<code>shash</code> でも引けます。</div>`;
    return;
  }
  $("list").innerHTML = out.slice(0,600).map((d,i)=>
    `<button class="ent" aria-expanded="false" data-i="${i}">
       <span class="top">
         <span class="w">${mark(d.w, s)}</span>
         <span class="j">${d.j}</span>
         ${d.c?`<span class="c">${d.c}</span>`:""}
       </span>
       <span class="g">${d.w.replace(/_/g,"")}</span>
       <span class="m">${d.ipa} · ${d.cat}</span>
       ${d.n?`<span class="n">${d.n}</span>`:""}
     </button>`).join("");
}
$("list").onclick = e=>{
  const b = e.target.closest(".ent"); if(!b) return;
  if(!b.querySelector(".n")) return;
  b.setAttribute("aria-expanded", b.getAttribute("aria-expanded")==="true" ? "false" : "true");
};
q.addEventListener("input", render);
clear.onclick = ()=>{ q.value=""; q.focus(); render(); };
render();
</script>
</body>
</html>
