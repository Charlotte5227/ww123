<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晷律暗号</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#12100E; --kuro:#1A1714; --kuro2:#241F1B; --line:#3A322C;
  --gofun:#E8E2D8; --hai:#8A8177; --shu:#C0392B; --shu-l:#D9553F; --kin:#B8894A;
  --disp:"Shippori Mincho B1",serif;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"DM Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sumi);color:var(--gofun);font-family:var(--body);font-size:15px;
  line-height:1.9;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(105deg,#1A1512 0%,transparent 55%);background-attachment:fixed}
.wrap{max-width:1140px;margin:0 auto;padding:0 26px 100px}
header{padding:76px 0 40px;position:relative}
header::after{content:"";position:absolute;left:0;bottom:0;width:120px;height:2px;background:var(--shu)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.3em;margin:0 0 26px;color:var(--hai)}
.eyebrow a{color:var(--hai);text-decoration:none;margin-right:16px}
.eyebrow a:hover,.eyebrow a[aria-current]{color:var(--shu-l)}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(44px,9vw,78px);letter-spacing:.3em;
  margin:0;line-height:1.05;text-indent:.3em}
.yomi{font-family:var(--disp);font-size:12px;letter-spacing:.55em;color:var(--hai);margin:20px 0 0;text-indent:.55em}
.lede{max-width:44ch;margin:32px 0 0;color:#B4ABA0;font-size:14.5px;line-height:2.1}
.tabs{display:flex;gap:26px;margin:52px 0 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--hai);
  font-family:var(--disp);font-size:16px;letter-spacing:.18em;padding:13px 4px;cursor:pointer;
  margin-bottom:-1px;transition:color .2s,border-color .2s}
.tab:hover{color:var(--gofun)}
.tab[aria-selected="true"]{color:var(--shu-l);border-bottom-color:var(--shu)}
.tab:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
.panel{display:none;padding-top:44px}
.panel.on{display:block}
.grid{display:grid;grid-template-columns:1fr 300px;gap:48px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:1fr;gap:34px}}
label.fld{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.26em;
  color:var(--hai);margin:0 0 12px;text-transform:uppercase}
textarea{width:100%;min-height:140px;resize:vertical;background:var(--kuro);color:var(--gofun);
  border:1px solid var(--line);border-radius:1px;padding:16px 18px;font-family:var(--body);
  font-size:16px;line-height:1.95;transition:border-color .2s}
textarea:focus{outline:none;border-color:var(--shu)}
textarea::placeholder{color:#544A42}
.row{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;align-items:flex-end}
.ctl{flex:1;min-width:150px}
select{width:100%;background:var(--kuro);color:var(--gofun);border:1px solid var(--line);
  border-radius:1px;padding:10px 12px;font-family:var(--body);font-size:14px}
input[type=range]{width:100%;height:28px;accent-color:var(--shu);border:0;background:none;padding:0}
select:focus,input:focus{outline:none;border-color:var(--shu)}
button{font-family:var(--disp);cursor:pointer;transition:all .2s}
button:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
.primary{background:var(--shu);color:#F6F1EA;border:0;border-radius:1px;font-size:17px;
  letter-spacing:.3em;padding:15px 42px;font-weight:700;text-indent:.3em;margin-top:34px}
.primary:hover{background:var(--shu-l)}
.primary:disabled{background:var(--kuro2);color:#5C5249;cursor:not-allowed}
.ghost{background:none;color:var(--gofun);border:1px solid var(--line);border-radius:1px;
  font-size:13.5px;letter-spacing:.18em;padding:11px 19px;text-indent:.18em}
.ghost:hover{border-color:var(--shu);color:var(--shu-l)}
.ghost[aria-pressed="true"]{border-color:var(--shu);color:var(--shu-l);background:#22120F}
.mini{font-family:var(--mono);font-size:11px;letter-spacing:.14em;background:none;border:0;
  color:var(--hai);padding:5px 0;text-decoration:underline;text-underline-offset:5px}
.mini:hover{color:var(--shu-l)}
.fig{border-left:1px solid var(--line);padding-left:22px}
.fig-cap{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--hai);margin:0 0 18px}
.dr{display:grid;grid-template-columns:16px 40px 1fr;gap:9px;align-items:center;margin-bottom:6px}
.dn{font-family:var(--mono);font-size:10px;color:#6E655C;text-align:right}
.dp{font-size:12px;color:var(--gofun)}
.dbarw{height:11px;background:var(--kuro2);border-radius:.5px;position:relative}
.dbar{height:100%;background:var(--kin);border-radius:.5px;transition:background .12s}
.dr.lit .dbar{background:var(--shu-l)}
.dr.lit .dp{color:var(--shu-l)}
.fig-note{font-family:var(--mono);font-size:9.5px;color:#6E655C;margin:18px 0 0;letter-spacing:.1em;line-height:1.9}
.out{margin-top:64px;border-top:1px solid var(--line);padding-top:36px;display:none}
.out.on{display:block}
.stat{display:flex;gap:34px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.1em;color:var(--hai);margin:0 0 28px}
.stat b{color:var(--gofun);font-weight:500}
.bar{display:flex;gap:11px;flex-wrap:wrap}
.drawer{display:none;margin-top:30px}
.drawer.on{display:block}
.scroll{overflow-x:auto;background:#0E0C0A;border:1px solid var(--line);border-radius:1px}
canvas.score{display:block;width:1160px;max-width:none}
.names{background:var(--kuro);border:1px solid var(--line);border-radius:1px;padding:24px}
.names h4{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--shu-l);
  margin:0 0 12px;font-weight:400}
.names h4:not(:first-child){margin-top:28px}
.nlist{display:flex;flex-wrap:wrap;gap:5px}
.nn{font-size:13px;background:var(--kuro2);border-radius:1px;padding:3px 9px;color:#C7BEB2;
  min-width:44px;text-align:center}
.nn.hd{background:#2A1512;color:var(--shu-l)}
.oneline{width:100%;background:#0E0C0A;color:#C7BEB2;border:1px solid var(--line);border-radius:1px;
  padding:12px 14px;font-family:var(--body);font-size:13.5px;white-space:pre;overflow-x:auto;
  resize:none;height:46px;line-height:1.5}
.oneline:focus{outline:none;border-color:var(--shu)}
.linebar{display:flex;gap:11px;align-items:center;margin-top:11px;flex-wrap:wrap}
.copied{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--shu-l);opacity:0;transition:opacity .2s}
.copied.on{opacity:1}
.blk{margin-bottom:11px}
.bno{font-family:var(--mono);font-size:10px;color:#6E655C;margin-right:12px}
.msg{font-family:var(--mono);font-size:12px;margin-top:18px;padding:12px 15px;
  border-left:2px solid var(--shu);background:#1E1310;color:#DFA79A;display:none}
.msg.on{display:block}
.ok{border-left-color:var(--kin);background:#1C1610;color:#CDA96F}
.result{background:var(--kuro);border:1px solid var(--line);border-radius:1px;padding:22px 24px;
  margin-top:26px;font-size:17px;line-height:2;white-space:pre-wrap;word-break:break-word;display:none}
.result.on{display:block}
footer{margin-top:92px;border-top:1px solid var(--line);padding-top:24px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#544A42;line-height:2}
footer p{margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js" onerror="window.__noLame=1"></script>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow" id="nav"></p>
  <h1>晷律暗号</h1>
  <p class="yomi">きりつあんごう</p>
  <p class="lede">音価の枝。1音が音高と音価の2桁を運ぶため、音符の数がおよそ半分になります。鍵表は音高と音価の両方に使い回します。</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-enc" aria-selected="true" aria-controls="p-enc">文を曲に</button>
  <button class="tab" role="tab" id="t-dec" aria-selected="false" aria-controls="p-dec">曲を文に</button>
</div>

<section class="panel on" id="p-enc" role="tabpanel" aria-labelledby="t-enc">
<div class="grid">
  <div>
    <label class="fld" for="src">本文</label>
    <textarea id="src" placeholder="ここに文を書きます。">こんにちは、世界AI2026。</textarea>
    <div class="row">
      <div class="ctl"><label class="fld" for="inst">楽器</label><select id="inst"></select></div>
      <div class="ctl"><label class="fld" for="tempo">速さ ♩= <span id="tempoV">180</span></label>
        <input type="range" id="tempo" min="60" max="300" step="10" value="180"></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="mini" id="reroll">鍵表を引き直す</button></div>
    <button class="primary" id="go">奏でる</button>
  </div>
  <div class="fig">
    <p class="fig-cap">音価の物差し — 鍵表を音高と音価で引く</p>
    <div id="ruler"></div>
    <p class="fig-note">数字 ／ 音高 ／ 音価の長さ<br>最短の16分から最長の付点全音符まで24倍</p>
  </div>
</div>

<div class="msg" id="encMsg"></div>

<div class="out" id="out">
  <div class="stat">
    <span>音数 <b id="sNotes">—</b></span><span>節 <b id="sBlk">—</b></span>
    <span>噪律なら <b id="sCmp">—</b></span><span>長さ <b id="sDur">—</b></span>
  </div>
  <div class="bar">
    <button class="ghost" id="play">聴く</button>
    <button class="ghost" id="dlAudio">音を書き出す</button>
    <button class="ghost" id="bScore" aria-pressed="false">譜に起こす</button>
    <button class="ghost" id="bNames" aria-pressed="false">音名で読む</button>
  </div>
  <div class="drawer" id="dScore">
    <div class="row" style="margin:0 0 14px">
      <button class="ghost" id="dlScore" style="margin-left:auto">譜面を書き出す</button>
    </div>
    <div class="scroll"><canvas class="score" id="score"></canvas></div>
  </div>
  <div class="drawer" id="dNames">
    <div class="names">
      <h4>1行の音名 — 音価の添え字つき</h4>
      <textarea class="oneline" id="oneline" readonly spellcheck="false"></textarea>
      <div class="linebar">
        <button class="ghost" id="copyLine">コピー</button>
        <button class="ghost" id="swKana" aria-pressed="true">ドレミ</button>
        <button class="ghost" id="swEn" aria-pressed="false">CDE</button>
        <span class="copied" id="copied">コピーしました</span>
      </div>
      <h4>鍵表 — 音高と音価が同じ並び</h4><div class="nlist" id="nlRow"></div>
      <h4>本体 — 9音で1節</h4><div id="nlBody"></div>
    </div>
  </div>
</div>
</section>

<section class="panel" id="p-dec" role="tabpanel" aria-labelledby="t-dec">
  <label class="fld" for="dsrc">音名と音価 — 「ソ♩.」のように音名の後ろに音価を付けます</label>
  <textarea id="dsrc" placeholder="ソ♩. ファ♩ レ♪ ソ♯𝅗𝅥 ラ𝅗𝅥. …"></textarea>
  <button class="primary" id="dgo">文に戻す</button>
  <div class="msg" id="decMsg"></div>
  <div class="result" id="dres"></div>
</section>

<footer>
  <p>冒頭12音は音高も音価も鍵表そのもの。以降は9音で4文字を運びます。</p>
  <p>音符は減りますが、音価が長いぶん演奏時間は縮みません。</p>
</footer>
</div>

<script src="core.js"></script>
<script src="audio.js"></script>
<script src="score.js"></script>
<script src="app.js"></script>
<script>
"use strict";
const {$} = App;
const PAL = {bg:"#0E0C0A", ink:"#E8E2D8", accent:"#C0392B", line:"#3A322C",
             ledger:"#8A8177", dim:"#5C5249", mute:"#8A8177",
             disp:'700 30px "Shippori Mincho B1",serif'};
$("nav").innerHTML = App.nav("kiritsu");
$("inst").innerHTML = Audio2.INSTRUMENTS.map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
let row = Core.makeRow(), cur = null, actx = null, srcNode = null, raf = 0, mode = "ja";
/* 図 — 音価の物差し */
function ruler() {
  const mx = Math.max(...Core.DURLEN);
  $("ruler").innerHTML = row.map((d,i)=>
    `<div class="dr" data-d="${d}">
       <span class="dn">${i}</span>
       <span class="dp">${Core.JA[d]}</span>
       <span class="dbarw"><span class="dbar" style="width:${(Core.DURLEN[d]/mx*100).toFixed(1)}%"></span></span>
     </div>`).join("");
}
function litRuler(dur) {
  $("ruler").querySelectorAll(".dr").forEach(e=>e.classList.toggle("lit", +e.dataset.d===dur));
}

function refreshRow(){ ruler(); }
refreshRow();
App.tabs(); App.drawers([["bScore","dScore"],["bNames","dNames"]]);
$("tempo").oninput = e => $("tempoV").textContent = e.target.value;
$("reroll").onclick = () => { row = Core.makeRow(); refreshRow();
  App.say("encMsg","鍵表を引き直しました。もう一度「奏でる」を押してください。",true); };

$("go").onclick = async () => {
  App.hush("encMsg");
  const text = $("src").value;
  if (!text) { App.say("encMsg","本文が空です。文を書いてから押してください。"); return; }
  let r;
  try { r = Core.Kiritsu.encode(text, row); }
  catch(e) { App.say("encMsg", e.message); return; }
  const quarter = 60/(+$("tempo").value);
  $("go").disabled = true; $("go").textContent = "奏でています…";
  try {
    const mel = Core.voice(r.notes.map(n=>n.pc));
    const timed = r.notes.map((n,i)=>({midi:mel[i], dur:n.dur}));
    const ev = Audio2.timed(timed, quarter);
    const buf = await Audio2.render(ev, {inst: $("inst").value});
    cur = {...r, mel, buf, ev, quarter};
    $("sNotes").textContent = r.notes.length;
    $("sBlk").textContent = r.blocks + " 節";
    $("sCmp").textContent = (13 + 19*r.blocks) + " 音";
    $("sDur").textContent = (buf.length/buf.sampleRate).toFixed(1) + " 秒";
    $("out").classList.add("on");
    fillNames(); drawScore();
  } catch(e) { App.say("encMsg","音を作れませんでした。" + e.message); }
  $("go").disabled = false; $("go").textContent = "奏でる";
};

function drawScore() {
  const items = cur.notes.map((n,i)=>({
    slot:i, pc:n.pc, oct: Math.floor(cur.mel[i]/12)-1, dur:n.dur,
    accent: i<12, bar: i===11 || (i>=12 && (i-11)%9===0)
  }));
  Score.render($("score"), {
    title:"晷律暗号", gap:40, palette:PAL,
    meta:`${cur.blocks} 節  ／  ${cur.notes.length} 音（噪律なら ${13+19*cur.blocks} 音）`,
    items
  });
}
function oneLine(){ return cur ? cur.notes.map(n=>Core.name(n.pc, mode==="en")+Core.DURN[n.dur]).join(" ") : ""; }
function syncLine(){ $("oneline").value = oneLine();
  $("swKana").setAttribute("aria-pressed", mode==="ja");
  $("swEn").setAttribute("aria-pressed", mode==="en"); }
$("swKana").onclick=()=>{mode="ja";syncLine();};
$("swEn").onclick=()=>{mode="en";syncLine();};
$("copyLine").onclick=()=>App.copy($("oneline"),"copied");

function fillNames() {
  syncLine();
  const span=(n,c)=>`<span class="nn${c?" "+c:""}">${Core.JA[n.pc]}${Core.DURN[n.dur]}</span>`;
  $("nlRow").innerHTML = cur.notes.slice(0,12).map(n=>span(n,"hd")).join("");
  let h="";
  for (let b=0;b<cur.blocks;b++) {
    const seg = cur.notes.slice(12+b*9, 21+b*9);
    h += `<div style="margin-bottom:10px"><span style="font-family:var(--mono);font-size:11px;
      color:var(--nezu);margin-right:10px">${String(b+1).padStart(2,"0")}節</span>
      <span class="nlist" style="display:inline-flex">${seg.map(n=>span(n)).join("")}</span></div>`;
  }
  $("nlBody").innerHTML = h;
}

$("play").onclick = () => {
  if (!cur) return;
  if (srcNode) { stop(); return; }
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  actx.resume();
  srcNode = actx.createBufferSource(); srcNode.buffer = cur.buf;
  srcNode.connect(actx.destination);
  const t0 = actx.currentTime;
  srcNode.start(); $("play").textContent = "止める"; srcNode.onended = stop;
  (function tick(){
    const t = actx.currentTime - t0;
    let k = -1;
    for (let i=0;i<cur.ev.length;i++) if (cur.ev[i].t <= t) k = i; else break;
    if (k>=0) litRuler(cur.notes[k].dur);
    raf = requestAnimationFrame(tick);
  })();
};
function stop() {
  if (srcNode) { try{srcNode.stop()}catch(_){} srcNode=null; }
  cancelAnimationFrame(raf); litRuler(-1); $("play").textContent="聴く";
}

$("dlAudio").onclick = () => {
  if (!cur) return;
  const m = Audio2.mp3(cur.buf);
  if (m) App.dl(m,"kiritsu.mp3");
  else { App.dl(Audio2.wav(cur.buf),"kiritsu.wav");
         App.say("encMsg","MP3 の変換器を読み込めなかったので WAV で書き出しました。",true); }
};
$("dlScore").onclick = () => $("score").toBlob(b=>App.dl(b,"kiritsu.png"));

$("dgo").onclick = () => {
  App.hush("decMsg"); $("dres").classList.remove("on");
  try {
    const notes = Core.parseTimed($("dsrc").value);
    const r = Core.Kiritsu.decode(notes);
    $("dres").textContent = r.text || "（空の本文です）";
    $("dres").classList.add("on");
    App.say("decMsg", `${notes.length} 音、${r.blocks} 節を読み解きました。`, true);
  } catch(e) { App.say("decMsg", e.message); }
};
</script>
</body>
</html>
