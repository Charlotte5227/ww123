<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗号一覧表</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-sub: #777777;
            --border-color: #E0E0E0;
            --item-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        .screen {
            display: none;
            padding: 30px 20px;
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-main);
            font-weight: bold;
        }

        /* --- 一覧画面のスタイル --- */
        .list-wrapper {
            max-height: calc(var(--item-height) * 5);
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            background: #FAFAFA;
        }

        .list-wrapper::-webkit-scrollbar { width: 6px; }
        .list-wrapper::-webkit-scrollbar-track { background: transparent; }
        .list-wrapper::-webkit-scrollbar-thumb { background: #CCC; border-radius: 3px; }

        .list {
            list-style: none;
        }

        .list-item {
            display: flex;
            align-items: center;
            height: var(--item-height);
            padding: 0 10px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item:hover {
            background-color: #F0F5FA;
        }

        .item-number {
            font-size: 14px;
            color: var(--text-sub);
            width: 24px;
            flex-shrink: 0;
            text-align: right;
            margin-right: 12px;
        }

        .item-symbol {
            font-size: 20px;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .move-btns {
            display: flex;
            gap: 2px;
            margin: 0 10px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 8px 4px;
            border-radius: 4px;
            transition: background 0.2s, opacity 0.2s;
        }
        .icon-btn:hover:not(:disabled) {
            background-color: #E2E8F0;
        }
        .icon-btn:active:not(:disabled) {
            background-color: #CBD5E1;
        }
        .icon-btn:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .item-link {
            font-size: 16px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }
        .item-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            font-size: 18px;
            margin-left: 5px;
            padding: 8px;
        }
        .delete-btn:hover {
            background-color: #FEE2E2;
        }

        /* --- ボタン・フォーム共通スタイル --- */
        .form-group { margin-bottom: 16px; }
        label {
            display: block; font-size: 14px; margin-bottom: 6px; color: var(--text-sub);
        }
        input[type="text"], input[type="url"] {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 16px; outline: none; transition: border 0.2s;
        }
        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }

        .btn {
            display: block; width: 100%; padding: 14px; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .btn-primary {
            background-color: var(--primary-color); color: white;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }
        .btn-primary:hover {
            background-color: var(--primary-hover); transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: transparent; color: var(--text-sub); margin-top: 10px;
        }
        .btn-secondary:hover { background-color: #EEEEEE; }
        
        .btn-danger {
            background-color: #E53E3E; color: white;
        }
        .btn-danger:hover { background-color: #C53030; }

        .empty-state {
            text-align: center; padding: 30px 10px; color: var(--text-sub); font-size: 14px;
        }

        /* --- カスタム確認ポップアップ（モーダル） --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }
        .modal-text {
            font-size: 16px;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions .btn {
            padding: 12px;
            margin-top: 0; /* secondaryのデフォルトマージンを打ち消し */
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 画面1: 一覧画面 -->
    <div id="view-list" class="screen active">
        <h1>暗号一覧表</h1>
        <div class="list-wrapper">
            <ul id="link-list" class="list"></ul>
        </div>
        <button id="btn-go-to-add" class="btn btn-primary">追加ボタン</button>
    </div>

    <!-- 画面2: 追加画面 -->
    <div id="view-add" class="screen">
        <h1>リンク追加</h1>
        <form id="add-form">
            <div class="form-group">
                <input type="text" id="input-symbol" placeholder="記号設定 (例: 🔑)">
            </div>
            <div class="form-group">
                <input type="text" id="input-name" placeholder="名前設定 (例: ポータルサイト)">
            </div>
            <div class="form-group">
                <input type="url" id="input-url" placeholder="URL設定 (例: https://...)">
            </div>
            <button type="button" id="btn-add-item" class="btn btn-primary">追加</button>
            <button type="button" id="btn-cancel" class="btn btn-secondary">キャンセルして戻る</button>
        </form>
    </div>
</div>

<!-- カスタム確認ポップアップ -->
<div id="delete-modal" class="modal-overlay">
    <div class="modal-content">
        <div id="delete-modal-text" class="modal-text">本当に削除しますか？</div>
        <div class="modal-actions">
            <button id="btn-cancel-delete" class="btn btn-secondary" style="background-color:#f0f0f0;">やめる</button>
            <button id="btn-confirm-delete" class="btn btn-danger">削除する</button>
        </div>
    </div>
</div>

<script>
    let links = JSON.parse(localStorage.getItem('cryptoLinks')) || [
        { symbol: '🔐', name: 'サンプルリンク', url: 'https://example.com' }
    ];

    const viewList = document.getElementById('view-list');
    const viewAdd = document.getElementById('view-add');
    const listUl = document.getElementById('link-list');
    
    const inputSymbol = document.getElementById('input-symbol');
    const inputName = document.getElementById('input-name');
    const inputUrl = document.getElementById('input-url');

    // ポップアップ用の要素
    const modalOverlay = document.getElementById('delete-modal');
    const modalText = document.getElementById('delete-modal-text');
    let deleteTargetIndex = null; // 削除対象の番号を一時保存する変数

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function saveAndRender() {
        localStorage.setItem('cryptoLinks', JSON.stringify(links));
        renderList();
    }

    function renderList() {
        listUl.innerHTML = '';
        if (links.length === 0) {
            listUl.innerHTML = '<div class="empty-state">データがありません。<br>下のボタンから追加してください。</div>';
            return;
        }

        links.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'list-item';
            
            const upDisabled = index === 0 ? 'disabled' : '';
            const downDisabled = index === links.length - 1 ? 'disabled' : '';

            li.innerHTML = `
                <span class="item-number">${index + 1}</span>
                <span class="item-symbol">${escapeHTML(item.symbol)}</span>
                <div class="move-btns">
                    <button class="icon-btn" onclick="moveItemUp(${index})" title="上に移動" ${upDisabled}>⬆️</button>
                    <button class="icon-btn" onclick="moveItemDown(${index})" title="下に移動" ${downDisabled}>⬇️</button>
                </div>
                <a href="${escapeHTML(item.url)}" target="_blank" class="item-link" rel="noopener noreferrer">${escapeHTML(item.name)}</a>
                <button class="icon-btn delete-btn" onclick="openDeleteModal(${index})" title="削除">🗑️</button>
            `;
            listUl.appendChild(li);
        });
    }

    // --- ポップアップ（モーダル）の処理 ---

    // ゴミ箱ボタンを押した時
    window.openDeleteModal = function(index) {
        deleteTargetIndex = index; // 何番目を消すか記憶
        // エスケープ処理をして安全に名前を表示
        modalText.innerHTML = `「<strong>${escapeHTML(links[index].name)}</strong>」<br>を削除してもよろしいですか？`;
        modalOverlay.style.display = 'flex';
        // 少し遅延させてclassを付与し、フワッと表示するアニメーションを適用
        setTimeout(() => modalOverlay.classList.add('show'), 10);
    };

    // ポップアップを閉じる処理
    function closeDeleteModal() {
        modalOverlay.classList.remove('show');
        setTimeout(() => {
            modalOverlay.style.display = 'none';
            deleteTargetIndex = null;
        }, 300); // アニメーションが終わるのを待ってから非表示
    }

    // 「やめる」ボタンを押した時
    document.getElementById('btn-cancel-delete').addEventListener('click', closeDeleteModal);

    // ポップアップの背景の暗い部分を押した時もキャンセル扱いにする
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeDeleteModal();
    });

    // 「削除する」ボタンを押した時
    document.getElementById('btn-confirm-delete').addEventListener('click', () => {
        if (deleteTargetIndex !== null) {
            links.splice(deleteTargetIndex, 1);
            saveAndRender();
            closeDeleteModal();
        }
    });

    // --- その他のアクション ---

    window.moveItemUp = function(index) {
        if (index > 0) {
            const temp = links[index];
            links[index] = links[index - 1];
            links[index - 1] = temp;
            saveAndRender();
        }
    };

    window.moveItemDown = function(index) {
        if (index < links.length - 1) {
            const temp = links[index];
            links[index] = links[index + 1];
            links[index + 1] = temp;
            saveAndRender();
        }
    };

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag])
        );
    }

    document.getElementById('btn-go-to-add').addEventListener('click', () => {
        inputSymbol.value = ''; inputName.value = ''; inputUrl.value = '';
        switchScreen('view-add');
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
        switchScreen('view-list');
    });

    document.getElementById('btn-add-item').addEventListener('click', () => {
        const symbol = inputSymbol.value.trim() || '🔗';
        const name = inputName.value.trim();
        const url = inputUrl.value.trim();

        if (!name || !url) {
            alert('名前設定とURL設定は必須です。');
            return;
        }
        
        let finalUrl = url;
        if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;

        links.push({ symbol, name, url: finalUrl });
        saveAndRender();
        switchScreen('view-list');
    });

    renderList();
</script>

</body>
</html>
