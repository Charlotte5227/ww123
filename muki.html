<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無幾暗号</title>
<style>
  :root{
    --paper:   #ece1cd;   /* 生成りの紙 */
    --paper-hi:#f4ecdc;   /* 便箋の面 */
    --paper-lo:#dccdb0;   /* 焼けた縁 */
    --ink:     #2b3648;   /* 没食子インク（青墨） */
    --ink-mid: #55607010;
    --ink-soft:#6a7284;
    --sepia:   #8a6a46;   /* 染み */
    --wax:     #9c3b2e;   /* 封蝋 */
    --mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Songti SC",serif;
    --gothic: "Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    --mono: ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --rule: 30px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background-color:var(--paper);
    background-image:
      radial-gradient(ellipse 70% 55% at 30% 18%, rgba(255,250,238,.75), transparent 65%),
      radial-gradient(ellipse 60% 50% at 82% 88%, rgba(138,106,70,.13), transparent 62%),
      radial-gradient(ellipse 120% 95% at 50% 50%, transparent 48%, rgba(138,106,70,.20) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--gothic);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{max-width:1140px;margin:0 auto;padding:30px 20px 90px}

  /* ---- 見出し ---- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
    padding-bottom:14px;margin-bottom:24px;
    border-bottom:1px solid rgba(43,54,72,.28);
  }
  .brand{display:flex;align-items:baseline;gap:16px}
  .brand h1{
    font-family:var(--mincho);
    font-size:clamp(30px,6vw,42px);
    font-weight:600;margin:0;letter-spacing:.2em;
    display:flex;gap:.08em;
  }
  .brand h1 span{display:inline-block}
  .g-h{transform:scaleX(-1)}
  .g-v{transform:scaleY(-1)}
  .g-b{transform:scale(-1,-1)}
  .brand small{
    font-family:var(--mincho);font-size:12px;letter-spacing:.36em;
    color:var(--ink-soft);
  }

  /* ---- 見出しの索引 ---- */
  .tabs{display:flex;gap:6px}
  .tab{
    font-family:var(--mincho);font-size:15px;letter-spacing:.14em;
    background:rgba(255,252,244,.5);color:var(--ink-soft);
    border:1px solid rgba(43,54,72,.24);border-bottom:none;
    padding:9px 20px 8px;cursor:pointer;
    border-radius:2px 2px 0 0;transition:color .18s,background .18s;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{
    background:var(--paper-hi);color:var(--ink);
    box-shadow:inset 0 3px 0 var(--wax);
  }
  .tab:focus-visible{outline:2px solid var(--wax);outline-offset:2px}

  .view[hidden]{display:none}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
  @media(max-width:860px){.split{grid-template-columns:1fr}}

  /* ---- 便箋 ---- */
  .card{
    background:var(--paper-hi);
    border:1px solid rgba(43,54,72,.2);
    border-radius:2px;
    padding:22px 24px 24px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px -12px rgba(60,44,26,.5);
    position:relative;
  }
  .card + .card{margin-top:20px}
  .card::after{
    content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,transparent,rgba(138,106,70,.16),transparent);
  }

  .eyebrow{
    font-family:var(--mincho);font-size:11px;letter-spacing:.34em;
    color:var(--sepia);margin:0 0 8px;display:block;
  }
  .card h2{
    font-family:var(--mincho);font-size:18px;font-weight:600;
    letter-spacing:.14em;margin:0 0 16px;color:var(--ink);
  }

  label.field{display:block;margin-bottom:16px}
  label.field > span{
    display:block;font-size:12px;letter-spacing:.1em;
    color:var(--ink-soft);margin-bottom:6px;
  }

  /* 罫線の入った書き込み欄 */
  textarea{
    width:100%;color:var(--ink);
    border:none;border-bottom:1px solid rgba(43,54,72,.3);
    background-color:transparent;
    background-image:repeating-linear-gradient(
      to bottom, transparent, transparent calc(var(--rule) - 1px),
      rgba(43,54,72,.16) calc(var(--rule) - 1px), rgba(43,54,72,.16) var(--rule));
    background-position:0 6px;
    padding:0 2px 6px;
    font-family:var(--mincho);font-size:17px;
    line-height:var(--rule);resize:vertical;min-height:calc(var(--rule)*3);
  }
  #decIn{font-family:var(--mono);letter-spacing:.2em;font-size:15px;min-height:calc(var(--rule)*5)}
  textarea:focus{outline:none;border-bottom-color:var(--wax)}

  select{
    width:100%;color:var(--ink);
    background:rgba(255,252,244,.7);
    border:1px solid rgba(43,54,72,.3);border-radius:2px;
    padding:9px 11px;font-family:var(--mono);font-size:16px;letter-spacing:.1em;
  }
  select:focus{outline:none;border-color:var(--wax)}

  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row > label.field{flex:1;min-width:130px;margin-bottom:0}

  button.act{
    font-family:var(--mincho);font-size:15px;letter-spacing:.18em;
    background:var(--wax);color:#fdf6ea;
    border:none;border-radius:2px;padding:11px 26px;cursor:pointer;
    box-shadow:0 2px 6px -3px rgba(90,30,20,.7);
    transition:filter .18s;
  }
  button.act:hover{filter:brightness(1.1)}
  button.ghost{
    font-family:var(--mincho);font-size:14px;letter-spacing:.12em;
    background:transparent;color:var(--ink);
    border:1px solid rgba(43,54,72,.36);border-radius:2px;
    padding:9px 18px;cursor:pointer;transition:background .18s;
  }
  button.ghost:hover{background:rgba(43,54,72,.07)}
  button:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default;filter:none}
  .btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

  /* ---- 書き写した文字列 ---- */
  .out{
    font-family:var(--mono);font-size:15px;letter-spacing:.24em;line-height:1.95;
    background-color:transparent;
    background-image:repeating-linear-gradient(
      to bottom, transparent, transparent calc(1.95em - 1px),
      rgba(43,54,72,.14) calc(1.95em - 1px), rgba(43,54,72,.14) 1.95em);
    padding:2px 2px 10px;white-space:pre;overflow-x:auto;
    color:var(--ink);min-height:60px;
  }
  .out .lead{color:var(--wax);font-weight:700}
  .plain{
    font-family:var(--mincho);font-size:21px;letter-spacing:.08em;line-height:1.9;
    padding:2px;min-height:60px;word-break:break-all;white-space:pre-wrap;
  }

  .note{font-size:12.5px;color:var(--ink-soft);margin:12px 0 0;line-height:1.8}
  .err{color:var(--wax);font-size:13px;margin:10px 0 0;min-height:1.2em}

  /* ---- 円盤 ---- */
  .diskwrap{
    display:flex;justify-content:center;
    padding:6px;background:rgba(255,252,244,.5);
    border:1px solid rgba(43,54,72,.16);
  }
  canvas#disk{width:100%;height:auto;display:block;max-width:600px}

  .readout{
    display:flex;gap:28px;flex-wrap:wrap;
    margin-top:16px;padding-top:14px;
    border-top:1px solid rgba(43,54,72,.22);
  }
  .readout div{display:flex;flex-direction:column;gap:1px}
  .readout dt{font-family:var(--mincho);font-size:11px;letter-spacing:.28em;color:var(--sepia)}
  .readout dd{margin:0;font-family:var(--mono);font-size:19px;letter-spacing:.1em;color:var(--ink)}

  /* ---- 手順の選択 ---- */
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media(max-width:620px){.toggles{grid-template-columns:1fr}}
  .toggles label{
    display:flex;align-items:flex-start;gap:11px;
    padding:9px 10px;cursor:pointer;
    border-bottom:1px solid rgba(43,54,72,.12);
    transition:background .16s;
  }
  .toggles label:hover{background:rgba(43,54,72,.05)}
  .toggles input, .flag input{
    appearance:none;width:15px;height:15px;flex:none;margin-top:6px;
    border:1px solid var(--ink-soft);border-radius:1px;cursor:pointer;
    transition:background .16s,border-color .16s;
  }
  .toggles input:checked, .flag input:checked{
    background:var(--wax);border-color:var(--wax);
    box-shadow:inset 0 0 0 2px var(--paper-hi);
  }
  .toggles input:focus-visible,.flag input:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
  .toggles .tl{font-family:var(--mincho);font-size:14.5px;letter-spacing:.06em}
  .toggles .ts{display:block;font-size:11.5px;color:var(--ink-soft);letter-spacing:0;line-height:1.5}

  canvas#proc{width:100%;height:auto;display:block;border:1px solid rgba(43,54,72,.16)}

  .flag{
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--ink-soft);cursor:pointer;margin-top:16px;
  }
  .flag input{margin-top:0}

  /* ---- 手順の展開 ---- */
  details.steps{
    margin-top:18px;padding-top:14px;
    border-top:1px solid rgba(43,54,72,.22);
  }
  details.steps > summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;
    font-family:var(--mincho);font-size:14px;letter-spacing:.12em;
    color:var(--ink-soft);transition:color .16s;
  }
  details.steps > summary:hover{color:var(--ink)}
  details.steps > summary::-webkit-details-marker{display:none}
  details.steps > summary::before{
    content:"＋";font-family:var(--mono);font-size:13px;
    width:19px;height:19px;flex:none;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(43,54,72,.34);border-radius:1px;color:var(--wax);
  }
  details.steps[open] > summary::before{content:"−"}
  details.steps > summary:focus-visible{outline:2px solid var(--wax);outline-offset:3px}
  .stepbox{margin-top:16px}
  .stepbox .st + .st{margin-top:18px;padding-top:16px;border-top:1px dashed rgba(43,54,72,.2)}
  .stepbox h3{
    font-family:var(--mincho);font-size:14.5px;font-weight:600;
    letter-spacing:.1em;margin:0;color:var(--ink);
  }
  .stepbox .sub{font-size:11.5px;color:var(--ink-soft);margin:2px 0 8px;line-height:1.6}
  .stepbox pre{
    margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.85;
    letter-spacing:.08em;color:var(--ink);
    white-space:pre;overflow-x:auto;
    padding:9px 11px;background:rgba(43,54,72,.045);
    border-left:2px solid rgba(156,59,46,.45);
  }

  .empty{
    color:var(--ink-soft);font-family:var(--mincho);font-size:14px;
    letter-spacing:.12em;text-align:center;padding:46px 10px;
  }

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <h1><span>無</span><span class="g-h">幾</span><span class="g-v">暗</span><span class="g-b">号</span></h1>
      <small>むきあんごう</small>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-enc" aria-selected="true" aria-controls="v-enc">暗号化</button>
      <button class="tab" role="tab" id="t-dec" aria-selected="false" aria-controls="v-dec">復号</button>
      <button class="tab" role="tab" id="t-pro" aria-selected="false" aria-controls="v-pro">手順書</button>
    </nav>
  </header>

  <!-- ============ 暗号化 ============ -->
  <section class="view" id="v-enc" role="tabpanel" aria-labelledby="t-enc">
    <div class="split">
      <div>
        <div class="card">
          <span class="eyebrow">もとのぶん</span>
          <h2>元の文章</h2>
          <label class="field">
            <span>Unicode 4桁で表せる文字のみ</span>
            <textarea id="encIn" rows="3">こんにちは</textarea>
          </label>
          <div class="row">
            <label class="field">
              <span>基準文字（k〜K）</span>
              <select id="baseSel"></select>
            </label>
            <button class="ghost" id="reroll">引き直す</button>
          </div>
          <div class="btnbar" style="margin-top:18px">
            <button class="act" id="encGo">暗号化する</button>
          </div>
          <p class="err" id="encErr"></p>
        </div>

        <div class="card">
          <span class="eyebrow">かきうつし</span>
          <h2>文字列</h2>
          <div class="out" id="encOut"></div>
          <p class="note">先頭の1文字が基準値を表します。復号にはこの形式を使ってください。</p>
          <div class="btnbar" style="margin-top:12px">
            <button class="ghost" id="copyStr">文字列をコピー</button>
          </div>
          <details class="steps" id="encSteps">
            <summary>この文章が暗号になるまで</summary>
            <div class="stepbox" id="encStepBody"></div>
          </details>
        </div>
      </div>

      <div class="card">
        <span class="eyebrow">えんばん</span>
        <h2>暗号画像</h2>
        <div class="diskwrap"><canvas id="disk"></canvas></div>
        <div class="readout">
          <div><dt>外環</dt><dd id="roOut">—</dd></div>
          <div><dt>内環</dt><dd id="roIn">—</dd></div>
          <div><dt>回転</dt><dd id="roRot">—</dd></div>
        </div>
        <label class="flag"><input type="checkbox" id="showTitle" checked>題字を入れる</label>
        <div class="btnbar" style="margin-top:14px">
          <button class="ghost" id="savePng">画像を保存</button>
        </div>
        <p class="note">文字列は北東に傾けてあります。二重円は同じ換字列で、内側は基準値の分だけ回っています。</p>
      </div>
    </div>
  </section>

  <!-- ============ 復号 ============ -->
  <section class="view" id="v-dec" role="tabpanel" aria-labelledby="t-dec" hidden>
    <div class="split">
      <div class="card">
        <span class="eyebrow">あんごうぶん</span>
        <h2>暗号文</h2>
        <label class="field">
          <span>先頭の1文字＋4行を貼り付け</span>
          <textarea id="decIn" rows="5" placeholder="M&#10;hdacA&#10;cibbd&#10;AdkaA&#10;Bebac"></textarea>
        </label>
        <div class="btnbar">
          <button class="act" id="decGo">復号する</button>
        </div>
        <p class="err" id="decErr"></p>
      </div>
      <div class="card">
        <span class="eyebrow">もとのぶん</span>
        <h2>元の文章</h2>
        <div class="plain" id="decOut"></div>
        <div class="readout">
          <div><dt>基準文字</dt><dd id="dcBase">—</dd></div>
          <div><dt>基準値</dt><dd id="dcVal">—</dd></div>
          <div><dt>文字数</dt><dd id="dcLen">—</dd></div>
        </div>
        <details class="steps" id="decSteps" hidden>
          <summary>この暗号が文章に戻るまで</summary>
          <div class="stepbox" id="decStepBody"></div>
        </details>
      </div>
    </div>
  </section>

  <!-- ============ 手順書 ============ -->
  <section class="view" id="v-pro" role="tabpanel" aria-labelledby="t-pro" hidden>
    <div class="split">
      <div class="card">
        <span class="eyebrow">えらぶ</span>
        <h2>載せる項目</h2>
        <div class="toggles" id="procToggles"></div>
        <div class="btnbar" style="margin-top:18px">
          <button class="ghost" id="allOn">すべて選ぶ</button>
          <button class="ghost" id="allOff">すべて外す</button>
        </div>
        <p class="note">ここで選んだ項目だけが手順画像に載ります。暗号画像には手順は入りません。</p>
      </div>
      <div class="card">
        <span class="eyebrow">てじゅんしょ</span>
        <h2>手順画像</h2>
        <canvas id="proc"></canvas>
        <p class="empty" id="procEmpty" hidden>項目を選ぶと画像になります</p>
        <div class="btnbar" style="margin-top:14px">
          <button class="ghost" id="saveProc">画像を保存</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
/* ============================================================
   核となる暗号処理
   ============================================================ */
const SEQ = "zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMNOPQRSTUVWXYZ";
const KMIN = SEQ.indexOf('k');   // 15
const KMAX = SEQ.indexOf('K');   // 36

// 基準は N 桁目（行優先で数えて文字数番目の桁）
/* 総桁数 4N を、正方形に最も近い整数比の長方形に組む。
   Nが素数のときは 4×N のままになる（4Nの約数が乏しいため） */
function gridShape(n){
  const D = 4*n;
  let best = [1, D];
  for(let r = 1; r*r <= D; r++){
    if(D % r) continue;
    if((D/r)/r < best[1]/best[0]) best = [r, D/r];
  }
  return { rows: best[0], cols: best[1] };
}

function encrypt(text, baseChar){
  const chars = Array.from(text);
  if(chars.length === 0) throw new Error("文章が空です。");
  for(const c of chars){
    if(c.codePointAt(0) > 0xFFFF)
      throw new Error(`「${c}」はUnicode4桁で表せません。`);
    if(c === "\n" || c === "\r")
      throw new Error("改行は使えません。1行で入力してください。");
  }
  const n = chars.length;
  const trace = [];

  // 手順1 — Unicode化とXOR偽装
  let digits = "", log1 = [];
  chars.forEach((c, i) => {
    const h = c.codePointAt(0).toString(16).toUpperCase().padStart(4,"0");
    let masks = [], out = "";
    for(let d = 0; d < 4; d++){
      const mask = (n + (i+1) + (d+1)) % 16;
      masks.push(mask.toString(16).toUpperCase());
      out += (parseInt(h[d],16) ^ mask).toString(16).toUpperCase();
    }
    digits += out;
    log1.push(`${c}  U+${h}  ⊕ ${masks.join(" ")}  →  ${out}`);
  });
  trace.push({t:"手順1　Unicode化とXOR偽装",
    s:`マスク ＝ (${n} ＋ 文字位置 ＋ 桁番号) mod 16`, b:log1.join("\n")});

  // 手順2 — 正方形に最も近い形に組む
  const SH = gridShape(n), C = SH.cols, R = SH.rows;
  let rows = [];
  for(let i = 0; i < digits.length; i += C) rows.push(digits.slice(i, i+C));
  trace.push({t:"手順2　正方形に近い形に組む",
    s:`総桁数 ${4*n} を ${R}行 × ${C}列 に（縦横比 ${(C/R).toFixed(2)}）`, b:rows.join("\n")});

  // 手順3・4 — 反転（自己逆元）
  const r3 = flipRow(rows, C);
  trace.push({t:"手順3　行内の反転",
    s:`各行を ${Math.floor(C/2)}｜${C-Math.floor(C/2)} で割り、後半を反転`, b:r3.join("\n")});
  rows = flipOrder(r3);
  trace.push({t:"手順4　行の反転",
    s:`${Math.floor(R/2)}行｜${R-Math.floor(R/2)}行 で割り、後半の行を反転`, b:rows.join("\n")});

  // 手順5 — 基準値（N桁目）
  const flat = rows.join("");
  const baseVal = parseInt(flat[n-1], 16);
  trace.push({t:"手順5　基準値", s:`行優先で数えて ${n} 桁目を読む`,
    b:`${n}桁目 ＝ ${flat[n-1]} ＝ ${baseVal}　（${Math.floor((n-1)/C)+1}行目 ${(n-1)%C+1}列目）`});

  // 手順6 — アルファベット化
  const bi = SEQ.indexOf(baseChar);
  const cipher = rows.map(r =>
    [...r].map(ch => SEQ[bi + (parseInt(ch,16) - baseVal)]).join("")
  );
  trace.push({t:"手順6　アルファベット化",
    s:`基準文字 ${baseChar} から、値と基準値の差分だけ換字列を移動`, b:cipher.join("\n")});

  return { rows: cipher, n, cols: C, nrows: R, baseChar, baseIdx: bi, baseVal,
           innerChar: SEQ[bi + baseVal], trace };
}

/* 手順3 — 各行の後半を反転 */
function flipRow(rows, n){
  const half = Math.floor(n/2);
  return rows.map(r => r.slice(0,half) + [...r.slice(half)].reverse().join(""));
}
/* 手順4 — 後半の行を反転 */
function flipOrder(rows){
  const h = Math.floor(rows.length/2);
  return rows.slice(0,h).concat(rows.slice(h).reverse());
}
/* 手順3＋4。互いに干渉せず、2回かけると元に戻る */
function flip(rows, n){ return flipOrder(flipRow(rows, n)); }

function decrypt(payload){
  const tok = payload.trim().split(/\s+/).filter(Boolean);
  if(tok.length < 2) throw new Error("先頭の1文字と4行が必要です。");
  const front = tok[0];
  if(front.length !== 1 || SEQ.indexOf(front) < 0)
    throw new Error("先頭は換字列の1文字にしてください。");
  const rows = tok.slice(1);
  if(rows.length < 2) throw new Error("本体が足りません。");
  const C = rows[0].length, R = rows.length;
  if(rows.some(r => r.length !== C)) throw new Error("各行の長さが揃っていません。");
  if(rows.some(r => [...r].some(c => SEQ.indexOf(c) < 0)))
    throw new Error("換字列にない文字が混ざっています。");
  const D = R*C;
  if(D % 4) throw new Error(`総桁数 ${D} が4の倍数ではありません。`);
  const n = D/4;
  const sh = gridShape(n);
  if(sh.rows !== R || sh.cols !== C)
    throw new Error(`${n}文字なら ${sh.rows}行×${sh.cols}列 のはずです。`);

  const baseChar = rows.join("")[n-1];
  const bi = SEQ.indexOf(baseChar);
  const baseVal = SEQ.indexOf(front) - bi;
  if(baseVal < 0 || baseVal > 15)
    throw new Error("先頭の文字と右上が噛み合いません。");

  const trace = [{t:"基準を読む", s:"総桁数を4で割れば文字数が出る",
    b:`${R}行 × ${C}列 ＝ ${D}桁\n文字数 ＝ ${D} ÷ 4 ＝ ${n}\n`+
      `${n}桁目 ＝ ${baseChar}（基準文字）\n先頭 ＝ ${front}\n基準値 ＝ ${baseVal}`}];

  const hexRows = rows.map(r => [...r].map(ch => {
    const v = SEQ.indexOf(ch) - bi + baseVal;
    if(v < 0 || v > 15) throw new Error("値が16進の範囲を外れました。");
    return v.toString(16).toUpperCase();
  }).join(""));
  trace.push({t:"手順6を戻す　16進に戻す",
    s:"各文字を差分に戻し、基準値を足す", b:hexRows.join("\n")});

  const u4 = flipOrder(hexRows);
  trace.push({t:"手順4を戻す　行の反転", s:"もう一度同じ操作をかける", b:u4.join("\n")});
  const u3 = flipRow(u4, C);
  trace.push({t:"手順3を戻す　行内の反転", s:"もう一度同じ操作をかける", b:u3.join("\n")});

  const digits = u3.join("");
  trace.push({t:"手順2を戻す　桁を連結", s:`${digits.length}桁に戻る`, b:digits});

  let text = "", log = [];
  for(let i = 0; i < n; i++){
    let h = "", masks = [];
    for(let d = 0; d < 4; d++){
      const mask = (n + (i+1) + (d+1)) % 16;
      masks.push(mask.toString(16).toUpperCase());
      h += (parseInt(digits[i*4+d],16) ^ mask).toString(16);
    }
    const c = String.fromCodePoint(parseInt(h,16));
    text += c;
    log.push(`${digits.slice(i*4,i*4+4)}  ⊕ ${masks.join(" ")}  →  U+${h.toUpperCase()}  ${c}`);
  }
  trace.push({t:"手順1を戻す　XORとUnicode",
    s:`マスク ＝ (${n} ＋ 文字位置 ＋ 桁番号) mod 16`, b:log.join("\n")});

  return { text, baseChar, baseVal, n, cols: C, nrows: R, trace };
}

/* ============================================================
   紙とインク
   ============================================================ */
const INK = "#2b3648", INK_R = 43, INK_G = 54, INK_B = 72;
const ink = a => `rgba(${INK_R},${INK_G},${INK_B},${a})`;
const NE = -Math.PI/4;                 // 北東（環を読む位置）
const TILT = Math.PI/4;                // 暗号文の傾き。1行目が北東の辺に乗る
const THICK = 3.2;                     // × と囲みの線の太さ（すべて同じ）
const XSTEP = 5;                       // × を打つ間隔（マス）
const STEP = Math.PI*2/52;
const MONO = `ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace`;
const MINCHO = `"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif`;

/* 種から決まる乱数。描き直しても同じ紙・同じ手ぶれになる */
function rng(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seedOf = s => {
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/* 紙は一度描いたら使い回す */
const paperCache = new Map();
function paper(W, H){
  const key = W + "x" + H;
  if(paperCache.has(key)) return paperCache.get(key);
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const r = rng(seedOf(key));

  x.fillStyle = "#eae0cb"; x.fillRect(0,0,W,H);

  let g = x.createRadialGradient(W*.33, H*.2, 0, W*.33, H*.2, Math.max(W,H)*.72);
  g.addColorStop(0, "rgba(253,248,236,.92)"); g.addColorStop(1, "rgba(253,248,236,0)");
  x.fillStyle = g; x.fillRect(0,0,W,H);

  // 染み
  for(let i=0;i<16;i++){
    const px = r()*W, py = r()*H, pr = 18 + r()*64;
    const fg = x.createRadialGradient(px,py,0,px,py,pr);
    const a = .05 + r()*.07;
    fg.addColorStop(0, `rgba(146,106,64,${a})`);
    fg.addColorStop(1, "rgba(146,106,64,0)");
    x.fillStyle = fg; x.beginPath(); x.arc(px,py,pr,0,Math.PI*2); x.fill();
  }

  // 繊維
  x.lineWidth = 1;
  const fibers = Math.round(W*H/900);
  for(let i=0;i<fibers;i++){
    const px = r()*W, py = r()*H, th = r()*Math.PI, len = 2 + r()*7;
    x.strokeStyle = r() < .5
      ? `rgba(120,96,64,${.035 + r()*.05})`
      : `rgba(255,252,242,${.05 + r()*.09})`;
    x.beginPath();
    x.moveTo(px,py);
    x.lineTo(px + Math.cos(th)*len, py + Math.sin(th)*len);
    x.stroke();
  }

  // 焼けた縁
  g = x.createRadialGradient(W/2,H/2,Math.min(W,H)*.34, W/2,H/2, Math.max(W,H)*.78);
  g.addColorStop(0,"rgba(138,106,70,0)"); g.addColorStop(1,"rgba(120,88,52,.26)");
  x.fillStyle = g; x.fillRect(0,0,W,H);

  paperCache.set(key, c);
  return c;
}

/* 手で引いたような円 */
function inkCircle(ctx, cx, cy, r0, rand, alpha, w){
  for(let pass=0; pass<2; pass++){
    ctx.strokeStyle = ink(alpha * (pass ? .5 : 1));
    ctx.lineWidth = w;
    ctx.beginPath();
    const off = (rand()-.5)*1.6, offy = (rand()-.5)*1.6;
    for(let i=0;i<=120;i++){
      const th = i/120*Math.PI*2;
      const rr = r0 + Math.sin(th*3 + r0) * 1.5 + Math.sin(th*7 + pass) * .9;
      const px = cx + off + Math.cos(th)*rr, py = cy + offy + Math.sin(th)*rr;
      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  }
}

/* ============================================================
   暗号画像
   ============================================================ */
function diskLayout(n, showTitle){
  const SH = gridShape(n);
  const cell = Math.max(24, Math.min(70, 640/Math.max(SH.cols, SH.rows)));
  const gw = SH.cols*cell, gh = SH.rows*cell;  // 方眼に合わせ、1桁がちょうど1マス
  const gr = Math.hypot(gw/2, gh/2);           // 傾けても外接円は変わらない
  const rIn  = Math.max(292, gr + 64);
  const rOut = rIn + 62;
  const Ro   = rOut + 24;                      // 外側の輪郭まで
  // 題字は一文字あたり整数マス。字の大きさは 50 を基準に、枠に収まるぶんだけ縮める
  const box  = Math.max(1, Math.ceil(46/cell)) * cell;
  const tfs  = Math.min(50, box*.92);
  const half = .3536 * 5 * box;                // 45度傾けたときの張り出し
  const TOP  = 44;
  const BOT  = showTitle ? Math.round(2*half + 44 + cell) : 44;
  const S    = Math.round(2*Ro + TOP + BOT);   // 画像は正方形
  const cy   = TOP + Ro;
  return { cell, gw, gh, rIn, rOut, S, cx: S/2, cy, box, tfs,
           cols: SH.cols, nrows: SH.rows, titleY: cy + Ro + BOT/2 };
}

function drawDisk(ctx, st, opts){
  const { rows, n, baseIdx } = st;
  const innerOffset = (opts.innerOffset !== undefined) ? opts.innerOffset : st.baseVal;
  const showTitle = !!opts.showTitle;
  const L = diskLayout(n, showTitle);
  const s = opts.scale || 1;
  const S = L.S, cell = L.cell, cx = L.cx, cy = L.cy;

  ctx.canvas.width = ctx.canvas.height = Math.round(S*s);
  ctx.setTransform(s,0,0,s,0,0);
  ctx.drawImage(paper(S,S), 0, 0);

  const r = rng(seedOf(rows.join("")+n));
  const tilt = (opts.rot !== undefined) ? opts.rot : TILT;

  // ===== 傾ける前の正方形の上ですべてを組む =====
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  const OX = -cx, OY = S - cy;                 // 原点＝正方形の左下
  const reach = S*1.15;
  const last  = Math.ceil(S/cell);

  // 罫線（画像全体に届かせる）
  ctx.strokeStyle = ink(.17); ctx.lineWidth = .9;
  const i0 = Math.floor((-reach - OX)/cell), i1 = Math.ceil((reach - OX)/cell);
  for(let i=i0;i<=i1;i++){
    const px = OX + i*cell;
    ctx.beginPath(); ctx.moveTo(px,-reach); ctx.lineTo(px,reach); ctx.stroke();
  }
  const j0 = Math.floor((OY - reach)/cell), j1 = Math.ceil((OY + reach)/cell);
  for(let j=j0;j<=j1;j++){
    const py = OY - j*cell;
    ctx.beginPath(); ctx.moveTo(-reach,py); ctx.lineTo(reach,py); ctx.stroke();
  }

  // × ＝ 原点から5マスごとの交差点だけ、半マス分太く
  //   文字数は □ が持つので、ここは方眼の目盛りとして一定間隔にする
  ctx.strokeStyle = ink(.44); ctx.lineWidth = THICK;
  for(let i=0;i<=last;i+=XSTEP) for(let j=0;j<=last;j+=XSTEP){
    const px = OX + i*cell, py = OY - j*cell;
    ctx.beginPath(); ctx.moveTo(px-cell/2,py); ctx.lineTo(px+cell/2,py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px,py-cell/2); ctx.lineTo(px,py+cell/2); ctx.stroke();
  }

  // 目盛り（南端・西端、原点から）
  ctx.fillStyle = ink(.5);
  ctx.font = `400 ${Math.round(cell*.26)}px ${MONO}`;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for(let i=0;i<=last;i++) ctx.fillText(String(i), OX + i*cell, OY + cell*.16);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for(let j=1;j<=last;j++) ctx.fillText(String(j), OX - cell*.16, OY - j*cell);

  // 暗号文を方眼に合わせる
  const left = OX + Math.round((-L.gw/2 - OX)/cell)*cell;
  const top  = OY - Math.round((OY + L.gh/2)/cell)*cell;

  // 囲み — 全体と、N桁目（基準）の一マス。太さは × と同じ
  ctx.strokeStyle = ink(.44); ctx.lineWidth = THICK;
  ctx.strokeRect(left, top, L.gw, L.gh);
  ctx.strokeRect(left + ((n-1) % L.cols)*cell,
                 top  + Math.floor((n-1) / L.cols)*cell, cell, cell);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `600 ${Math.round(cell*.6)}px ${MONO}`;
  rows.forEach((row, ri) => {
    [...row].forEach((ch, ci) => {
      ctx.save();
      ctx.translate(left + ci*cell + cell/2 + (r()-.5)*2,
                    top  + ri*cell + cell/2 + (r()-.5)*2);
      ctx.rotate((r()-.5)*.05);
      ctx.fillStyle = ink(.88 + r()*.1);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    });
  });
  // 題字 — 一文字ずつマスに収める
  if(showTitle){
    const box = L.box;
    const d   = (L.titleY - cy) * Math.SQRT1_2;      // 傾けた座標系での中心
    const tlx = OX + Math.round((d - 2*box - OX)/cell)*cell;
    const tly = OY - Math.round((OY - (d - box/2))/cell)*cell;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `600 ${Math.round(L.tfs)}px ${MINCHO}`;
    [["無",1,1],["幾",-1,1],["暗",1,-1],["号",-1,-1]].forEach((gl, i) => {
      ctx.save();
      ctx.translate(tlx + i*box + box/2 + (r()-.5)*2, tly + box/2 + (r()-.5)*2);
      ctx.rotate((r()-.5)*.03);
      ctx.scale(gl[1], gl[2]);
      ctx.fillStyle = ink(.82);
      ctx.fillText(gl[0], 0, 0);
      ctx.restore();
    });
  }
  ctx.restore();

  // ===== 円は傾けない =====
  inkCircle(ctx, cx, cy, L.rOut + 24, r, .34, 1.1);
  inkCircle(ctx, cx, cy, L.rOut - 24, r, .22, .9);
  inkCircle(ctx, cx, cy, L.rIn  + 23, r, .22, .9);
  inkCircle(ctx, cx, cy, L.rIn  - 25, r, .34, 1.1);
  ringLetters(ctx, cx, cy, L.rOut, baseIdx,               r, 27);
  ringLetters(ctx, cx, cy, L.rIn,  baseIdx + innerOffset, r, 27);

  return { W: S, H: S };
}

function ringLetters(ctx, cx, cy, rad, anchor, r, fs){
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `500 ${fs}px ${MONO}`;
  for(let i=0;i<52;i++){
    const th = NE + (i - anchor)*STEP;
    const rr = rad + (r()-.5)*3;
    ctx.save();
    ctx.translate(cx + Math.cos(th)*rr, cy + Math.sin(th)*rr);
    ctx.rotate(th + Math.PI/2 + (r()-.5)*.07);
    ctx.fillStyle = ink(.68 + r()*.2);
    ctx.fillText(SEQ[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

/* ============================================================
   手順画像
   ============================================================ */
const PROC = [
  { id:"p1", n:"手順1", t:"Unicode化とXOR偽装", s:"各文字を16進4桁にし、マスクとXORを取る", b:[
    "元の文章の各文字を Unicode 16進4桁で表す。",
    "各桁について次のマスクとの XOR を取り、結果を16進1桁で書く。",
    "▸ マスク ＝ （文字数 ＋ 文字位置 ＋ 桁番号） mod 16",
    "文字位置・桁番号はいずれも1始まり。" ]},
  { id:"p2", n:"手順2", t:"組み直し", s:"正方形に最も近い形に折り返す", b:[
    "得られた桁を順に並べ、正方形に最も近い整数比の長方形に組む。",
    "▸ 総桁数は文字数の4倍。その約数のうち、平方根に最も近い組を選ぶ。",
    "文字数が素数のときは 4行 × 文字数列 になる。" ]},
  { id:"p3", n:"手順3", t:"行内の反転", s:"各行の後半をひっくり返す", b:[
    "各行を半分で割り、後半を反転する。",
    "半分にできない場合は、後半を1文字多くする。" ]},
  { id:"p4", n:"手順4", t:"行の反転", s:"後半の行をひっくり返す", b:[
    "全体の後半半分の行を反転する。",
    "半分にできない場合は、後半を1行多くする。" ]},
  { id:"p5", n:"手順5", t:"基準値の特定", s:"文字数番目の桁を読む", b:[
    "できあがった盤面を行優先で数え、文字数と同じ番目の桁を取る。",
    "▸ 4行に組んだときの1行目の末尾にあたる位置。",
    "その桁の値が基準値となる。画像ではこの一マスが囲まれている。" ]},
  { id:"p6", n:"手順6", t:"アルファベット化", s:"基準値との差分を文字に置き換える", b:[
    "換字列の k 〜 K からランダムに1文字を選び、基準文字とする。",
    "各桁の値と基準値の差分だけ、基準文字から換字列上を移動する。",
    "▸ ＋1 で列の後方へ1つ、−1 で前方へ1つ。",
    "例：基準文字が k なら ＋15 は E、−15 は z。" ]},
  { id:"pr", n:"円",   t:"二重円の読み方", s:"外側が基準文字、内側が基準値", b:[
    "外環と内環はどちらも同じ換字列。",
    "北東に来ている文字を読む。外環が基準文字、内環がそこから基準値だけ進んだ文字。",
    "内環は外環を基準値の分だけ回した状態にある。" ]},
  { id:"ps", n:"列",   t:"換字列", s:"52文字の並び", b:[
    "zyxwvutsrqponmlkjihgfedcba",
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    "この2段を続けた52文字を1本の列として扱う。" ]},
  { id:"pi", n:"性質", t:"反転は二度で戻る", s:"手順3と4は自己逆元", b:[
    "手順3は行の中身だけ、手順4は行の順番だけを操作するため、互いに干渉しない。",
    "どちらも2回実行すると元に戻る。" ]},
  { id:"pd", n:"復号", t:"戻し方", s:"手順6から順に遡る", b:[
    "北東から基準文字と基準値を読む。",
    "各文字を差分に戻し、基準値を足して16進に戻す。",
    "反転を戻し、総桁数を4で割って文字数を出し、マスクを組み直して XOR を戻す。",
    "16進4桁ごとに区切って Unicode として読む。" ]}
];

function drawProc(ctx, ids, scale){
  const items = PROC.filter(p => ids.includes(p.id));
  const s = scale || 1, W = 1000, PAD = 64;
  const measure = document.createElement("canvas").getContext("2d");

  let h = PAD + 100;
  const blocks = items.map(p => {
    measure.font = `400 19px ${MINCHO}`;
    const lines = p.b.flatMap(t => wrap(measure, t, W - PAD*2 - 76));
    const bh = 46 + lines.length*33 + 30;
    h += bh;
    return { p, lines, bh };
  });
  h += PAD - 26;

  ctx.canvas.width = Math.round(W*s);
  ctx.canvas.height = Math.round(h*s);
  ctx.setTransform(s,0,0,s,0,0);
  ctx.drawImage(paper(W,h), 0, 0);

  const r = rng(seedOf(ids.join("")));
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

  // 題字
  ctx.font = `600 38px ${MINCHO}`;
  [["無",1,1],["幾",-1,1],["暗",1,-1],["号",-1,-1]].forEach((gl,i) => {
    ctx.save();
    ctx.translate(PAD + i*50 + 19, PAD + 12);
    ctx.rotate((r()-.5)*.03);
    ctx.scale(gl[1], gl[2]);
    ctx.fillStyle = ink(.86);
    ctx.fillText(gl[0], -19, 13);
    ctx.restore();
  });
  ctx.fillStyle = ink(.5);
  ctx.font = `400 14px ${MINCHO}`;
  ctx.fillText("てじゅん", PAD + 228, PAD + 20);

  // 手書きの罫
  ctx.strokeStyle = ink(.3); ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x0=PAD; x0<=W-PAD; x0+=12) ctx[x0===PAD?"moveTo":"lineTo"](x0, PAD+52+(r()-.5)*1.6);
  ctx.stroke();

  let y = PAD + 100;
  blocks.forEach(({p, lines, bh}) => {
    ctx.strokeStyle = "rgba(156,59,46,.6)"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(PAD+(r()-.5), y-6);
    ctx.lineTo(PAD+(r()-.5), y + bh - 44);
    ctx.stroke();

    ctx.fillStyle = "rgba(138,106,70,.95)";
    ctx.font = `400 14px ${MINCHO}`;
    ctx.fillText(p.n, PAD+20, y+6);
    ctx.fillStyle = ink(.92);
    ctx.font = `600 24px ${MINCHO}`;
    ctx.fillText(p.t, PAD+76, y+8);

    ctx.font = `400 19px ${MINCHO}`;
    lines.forEach((ln, i) => {
      const key = ln.startsWith("▸");
      ctx.fillStyle = key ? "rgba(156,59,46,.95)" : ink(.8);
      ctx.fillText(ln, PAD+76, y + 46 + i*33);
    });
    y += bh;
  });
  return { W, H: h };
}

function wrap(ctx, text, max){
  const out = []; let cur = "";
  for(const ch of text){
    if(ctx.measureText(cur+ch).width > max && cur){ out.push(cur); cur = ch; }
    else cur += ch;
  }
  if(cur) out.push(cur);
  return out;
}

/* ============================================================
   画面

const $ = id => document.getElementById(id);
let state = null, dispOffset = 0, animId = null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TABS = [["t-enc","v-enc"],["t-dec","v-dec"],["t-pro","v-pro"]];

      $(v).hidden = !on;
    });
    if(vw === "v-pro") renderProc();
  });
});

const sel = $("baseSel");
for(let i = KMIN; i <= KMAX; i++){
  const o = document.createElement("option");
  o.value = SEQ[i]; o.textContent = SEQ[i];
  sel.appendChild(o);
}
const roll = () => SEQ[KMIN + Math.floor(Math.random()*(KMAX-KMIN+1))];
sel.value = roll();
$("reroll").addEventListener("click", () => { sel.value = roll(); run(); });
sel.addEventListener("change", run);
$("encGo").addEventListener("click", run);
$("showTitle").addEventListener("change", paint);

function run(){
  const err = $("encErr");
  try{
    const raw = $("encIn").value.trim();
    const st = encrypt(raw, sel.value);
    if(decrypt(toPayload(st)).text !== raw)
      throw new Error("検算に失敗しました。入力を確認してください。");
    state = st;
    err.textContent = "";
    $("encOut").innerHTML = `<span class="lead">${st.innerChar}</span>\n` + st.rows.join("\n");
    $("roOut").textContent = st.baseChar;
    $("roIn").textContent  = `${st.innerChar}　${st.baseVal}`;
    $("roRot").textContent = (st.baseVal * 360/52).toFixed(1) + "°";
    renderTrace($("encStepBody"), st.trace);
    animate(st.baseVal);
  }catch(e){ err.textContent = e.message; }
}

const toPayload = st => st.innerChar + "\n" + st.rows.join("\n");

const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function renderTrace(el, trace){
  el.innerHTML = trace.map(x =>
    `<div class="st"><h3>${esc(x.t)}</h3>` +
    (x.s ? `<p class="sub">${esc(x.s)}</p>` : "") +
    `<pre>${esc(x.b)}</pre></div>`).join("");
}

function animate(target){
  if(reduce){ dispOffset = target; paint(); return; }
  cancelAnimationFrame(animId);
  const from = dispOffset, t0 = performance.now(), dur = 560;
  const tick = now => {
    const k = Math.min(1, (now-t0)/dur);
    dispOffset = from + (target-from)*(1 - Math.pow(1-k, 3));
    paint();
    if(k < 1) animId = requestAnimationFrame(tick);
  };
  animId = requestAnimationFrame(tick);
}

function paint(){
  if(!state) return;
  drawDisk($("disk").getContext("2d"), state,
    { scale: 1, showTitle: $("showTitle").checked, innerOffset: dispOffset });
}

$("savePng").addEventListener("click", () => {
  if(!state) return;
  const c = document.createElement("canvas");
  drawDisk(c.getContext("2d"), state, { scale: 2, showTitle: $("showTitle").checked });
  save(c, "無幾暗号.png");
});
$("copyStr").addEventListener("click", async () => {
  if(!state) return;
  const b = $("copyStr");
  try{
    await navigator.clipboard.writeText(toPayload(state));
    b.textContent = "写しました";
  }catch{ b.textContent = "コピーできません"; }
  setTimeout(() => b.textContent = "文字列をコピー", 1600);
});
function save(canvas, name){
  canvas.toBlob(bl => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(bl); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1200);
  });
}

$("decGo").addEventListener("click", () => {
  const err = $("decErr");
  try{
    const r = decrypt($("decIn").value);
    err.textContent = "";
    $("decOut").textContent = r.text;
    $("dcBase").textContent = r.baseChar;
    $("dcVal").textContent  = r.baseVal;
    $("dcLen").textContent  = r.n;
    renderTrace($("decStepBody"), r.trace);
    $("decSteps").hidden = false;
  }catch(e){
    err.textContent = e.message;
    $("decOut").textContent = "";
    $("dcBase").textContent = $("dcVal").textContent = $("dcLen").textContent = "—";
    $("decSteps").hidden = true;
  }
});

const tg = $("procToggles");
PROC.forEach(p => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" value="${p.id}" checked>
    <span><span class="tl">${p.t}</span><span class="ts">${p.s}</span></span>`;
  tg.appendChild(l);
});
tg.addEventListener("change", renderProc);
$("allOn").addEventListener("click", () => setAll(true));
$("allOff").addEventListener("click", () => setAll(false));
function setAll(v){
  tg.querySelectorAll("input").forEach(i => i.checked = v);
  renderProc();
}
const chosen = () => [...tg.querySelectorAll("input:checked")].map(i => i.value);
function renderProc(){
  const ids = chosen();
  $("proc").hidden = ids.length === 0;
  $("procEmpty").hidden = ids.length !== 0;
  $("saveProc").disabled = ids.length === 0;
  if(ids.length) drawProc($("proc").getContext("2d"), ids, 1);
}
$("saveProc").addEventListener("click", () => {
  const ids = chosen();
  if(!ids.length) return;
  const c = document.createElement("canvas");
  drawProc(c.getContext("2d"), ids, 2);
  save(c, "無幾暗号_手順.png");
});

document.fonts?.ready.then(() => { paint(); renderProc(); });
run();
renderProc();
</script>
</body>
</html>
