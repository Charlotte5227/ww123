<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>煌星暗号 — 星図変換機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03060E; --plate:#050912; --ink:#0A1122; --rule:#1A2740;
  --orbit:#1E3054; --star:#9BB0FF; --amber:#F2C46B;
  --text:#C7D3EE; --dim:#7387AC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void); color:var(--text);
  font-family:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
.wrap>*{min-width:0}
.ledger{overflow-x:auto}
@media(min-width:901px){.wrap{height:100vh;overflow:hidden}aside{overflow-y:auto}main{overflow:hidden;min-height:0}}

/* ── instrument panel ───────────────────────── */
aside{
  border-right:1px solid var(--rule); padding:34px 30px 60px;
  background:linear-gradient(180deg,#060B16,#040711);
  display:flex;flex-direction:column;gap:26px;
}
h1{
  font-family:'Zen Old Mincho','Yu Mincho',serif; font-weight:600;
  font-size:30px; letter-spacing:.22em; line-height:1.25; color:#E4ECFF;
}
h1 small{display:block;font-family:'Cormorant Garamond',serif;font-size:12px;
  letter-spacing:.42em;color:var(--dim);margin-top:10px;font-weight:400}
.lede{color:var(--dim);font-size:12.5px;border-top:1px solid var(--rule);padding-top:18px}

.field label{
  display:block;font-family:'Cormorant Garamond',serif;font-size:12px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;
}
textarea,input[type=text]{
  width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:2px;
  color:var(--text);font-family:inherit;font-size:15px;padding:12px 13px;resize:vertical;
}
input[type=text]{font-family:'Cormorant Garamond',ui-monospace,monospace;letter-spacing:.09em;font-size:14px}
textarea:focus,input:focus{outline:none;border-color:#3A557F;background:#0C1428}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px}

.row{display:flex;gap:9px;flex-wrap:wrap}
button{
  flex:1;min-width:118px;background:transparent;border:1px solid #2C4066;color:var(--star);
  font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.2em;
  padding:11px 8px;border-radius:2px;cursor:pointer;transition:.18s;
}
button:hover{background:#101B33;border-color:#4A69A0;color:#DCE6FF}
button.ghost{color:var(--dim);border-color:var(--rule)}
button.ghost:hover{color:var(--text)}

.toggles{display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--dim)}
.toggles label{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggles input{accent-color:#4A69A0;width:14px;height:14px}

.out{
  background:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:12px 13px;
  font-family:'Cormorant Garamond',ui-monospace,monospace;font-size:14px;
  letter-spacing:.11em;word-break:break-all;color:var(--amber);min-height:44px;
}
.out.plain{color:var(--text);font-family:inherit;letter-spacing:0}
.err{color:#E08A7A;font-size:12.5px}

/* ── plate ──────────────────────────────────── */
main{position:relative;display:flex;flex-direction:column;background:var(--plate)}
.plateframe{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:52px}
.plateframe::after{
  content:'';position:absolute;inset:20px;border:1px solid #101B30;pointer-events:none;
}
#chart{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#chart svg{width:100%;height:100%}
.corner{
  position:absolute;font-family:'Cormorant Garamond',serif;font-size:11px;
  letter-spacing:.34em;color:#33456A;pointer-events:none;text-transform:uppercase;
}
.corner.tl{top:30px;left:34px}
.corner.tr{top:30px;right:34px}
.corner.br{bottom:30px;right:34px;letter-spacing:.14em;max-width:52%;text-align:right;
  word-break:break-all;color:#3B4E76}

/* ── ledger ─────────────────────────────────── */
.ledger{border-top:1px solid var(--rule);padding:20px 34px 26px;background:#040711;max-height:36vh;overflow:auto}
.ledger h2{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.34em;
  color:var(--dim);text-transform:uppercase;margin-bottom:12px;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:#040711}
th{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:.18em;
  color:var(--dim);text-align:left;padding:5px 12px 7px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid #0E1728;
  font-family:'Cormorant Garamond',ui-monospace,monospace;letter-spacing:.06em;white-space:nowrap}
td.ch{font-family:'Zen Old Mincho',serif;font-size:17px;color:#E4ECFF}
td.amb{color:var(--amber)}
td.st{color:var(--star)}

/* ── order sheet ────────────────────────────── */
dialog{
  background:var(--plate);color:var(--text);border:1px solid var(--rule);border-radius:3px;
  padding:30px 34px;max-width:min(920px,92vw);
}
dialog::backdrop{background:#02040Ae0}
dialog h2{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.34em;
  color:var(--dim);text-transform:uppercase;margin-bottom:6px;font-weight:400}
dialog p{font-size:12.5px;color:var(--dim);margin-bottom:18px}
dialog .close{margin-top:20px;max-width:170px}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{border-right:none;border-bottom:1px solid var(--rule);padding:26px 20px 34px}
  .plateframe{min-height:56vh;padding:20px}
  .plateframe::after{inset:10px}
  .corner{display:none}
  .ledger{padding:18px 20px 24px}
}
</style>
</head>
<body>
<div class="wrap">

<aside>
  <div>
    <h1>煌星暗号<small>Kousei Cipher</small></h1>
  </div>
  <p class="lede">文字列を恒星系の星図に変換する画像暗号。正本は図であり、文字列は副次的な表現にすぎない。</p>

  <div class="field">
    <label for="src">平文</label>
    <textarea id="src" rows="3" spellcheck="false">燦めく𤴇🌟</textarea>
    <p class="hint">文字種が雑多なほど多角形が立ち上がる。</p>
  </div>

  <div class="row">
    <button id="enc">星図を描く</button>
    <button id="sheet" class="ghost">読み順表</button>
  </div>

  <div class="field">
    <label>文字列形式</label>
    <div class="out" id="strout">—</div>
    <p class="hint">他者に渡す際は、必ず別の暗号機に掛けること。</p>
  </div>

  <div class="field">
    <label for="cipher">復号</label>
    <input type="text" id="cipher" spellcheck="false" placeholder="O01301HE6…">
    <div class="row" style="margin-top:9px">
      <button id="dec">文字に戻す</button>
    </div>
    <div class="out plain" id="decout" style="margin-top:10px">—</div>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="tGuide" checked> 一筆書きの点線を描く</label>
    <label><input type="checkbox" id="tField" checked> 背景の星を描く</label>
    <label><input type="checkbox" id="tRule"> 公転軌道を濃く引く</label>
  </div>

  <div class="row">
    <button id="dlsvg" class="ghost">SVG 保存</button>
    <button id="dlpng" class="ghost">PNG 保存</button>
  </div>
</aside>

<main>
  <div class="plateframe">
    <span class="corner tl">Plate No. <span id="plateno">—</span></span>
    <span class="corner tr" id="syscount">—</span>
    <div id="chart"></div>
    <span class="corner br" id="etch"></span>
  </div>
  <div class="ledger">
    <h2>Ledger</h2>
    <table>
      <thead><tr><th>字</th><th>符号</th><th>恒星</th><th>惑星部</th><th>4進</th><th>衛星</th><th>小惑星部</th><th>帯</th></tr></thead>
      <tbody id="ledger"></tbody>
    </table>
  </div>
</main>
</div>

<dialog id="orderdlg">
  <h2>Reading Order</h2>
  <p>上の頂点を1番目とし、左方向へ一筆書きした線を辿る。</p>
  <div id="ordersheet"></div>
  <button class="close" onclick="orderdlg.close()">閉じる</button>
</dialog>

<script>
/* ══ 定数 ═════════════════════════════════════ */
const SPECTRAL = "OBAFGKM";
const SPEC_COL = {O:"#9BB0FF",B:"#AABFFF",A:"#CAD7FF",F:"#F8F7FF",G:"#FFF3E3",K:"#FFD09A",M:"#FFA96B"};
const R0=28, DR=28, PR=4, MR=1.7, MD=10.5;
const P_COL="#E4ECFF", M_COL="#93A9D6", A_COL="#F2C46B", ORB="#1E3054";

/* ══ 種つき乱数(同じ平文は必ず同じ図になる) ══ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ══ 符号化 ═══════════════════════════════════ */
function toBase4(n){if(n===0)return"0";let o="";while(n>0){o=(n%4)+o;n=Math.floor(n/4)}return o}
function hex6(cp){return cp.toString(16).toUpperCase().padStart(6,"0")}

function parse(text){
  const sys=[];
  for(const ch of text){
    const h=hex6(ch.codePointAt(0));
    const s=h.slice(0,2), p=h.slice(2,4), a=h.slice(4,6);
    if(sys.length && sys[sys.length-1].s===s) sys[sys.length-1].chars.push({ch,p,a});
    else sys.push({s,chars:[{ch,p,a}]});
  }
  return sys;
}
function starOf(s){
  const o=parseInt(s,16).toString(8).padStart(2,"0");
  return {spec:SPECTRAL[+o[0]], dia:+o[1], r:R0*(0.66-0.045*(+o[1]))};
}
function ringsOf(sys){
  const r=[];
  for(const c of sys.chars){
    for(const d of toBase4(parseInt(c.p,16))) r.push({k:"P",v:+d});
    for(const d of c.a) r.push({k:"A",v:parseInt(d,16)});
  }
  return r;
}
const radiusOf = sys => R0 + (ringsOf(sys).length-1)*DR;

function toStringForm(sys){
  let out="";
  for(const s of sys){
    const o=parseInt(s.s,16).toString(8).padStart(2,"0");
    out += SPECTRAL[+o[0]] + o[1];
    for(const c of s.chars) out += toBase4(parseInt(c.p,16)) + "H" + c.a;
  }
  return out;
}

/* ══ 復号 ═════════════════════════════════════ */
function fromStringForm(str){
  const t=str.replace(/\s+/g,"").toUpperCase();
  let i=0, plane=null, out="";
  if(!t) throw new Error("入力が空です。");
  while(i<t.length){
    const c=t[i];
    if(SPECTRAL.includes(c) && (i===0 || plane!==null) && /[0-7]/.test(t[i+1]||"") && !(plane!==null && /^[0-3]$/.test(c))){
      plane=parseInt(""+SPECTRAL.indexOf(c)+t[i+1],8); i+=2; continue;
    }
    if(plane===null) throw new Error("恒星の指定で始まっていません。");
    const j=t.indexOf("H",i);
    if(j<0) throw new Error("区切りの H が見つかりません。");
    const p=t.slice(i,j), a=t.slice(j+1,j+3);
    if(!p.length || !/^[0-3]+$/.test(p)) throw new Error("惑星部が4進数ではありません:「"+p+"」");
    if(!/^[0-9A-F]{2}$/.test(a)) throw new Error("小惑星部が16進2桁ではありません:「"+a+"」");
    let n=0; for(const d of p) n=n*4+(+d);
    if(n>255) throw new Error("惑星部が大きすぎます:「"+p+"」");
    out += String.fromCodePoint(plane*0x10000 + n*0x100 + parseInt(a,16));
    i=j+3;
  }
  return out;
}

/* ══ 配置(n芒星) ════════════════════════════ */
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function layout(n,R){
  const ang=j=>Math.PI/2 + 2*Math.PI*j/n;
  const outer=[...Array(n)].map((_,j)=>[R*Math.cos(ang(j)), -R*Math.sin(ang(j))]);
  if(n===1) return {order:[[0,0]],guide:null};
  if(n===2) return {order:[[0,0],[-R*0.82,-R*0.57]],guide:null};
  if(n===3) return {order:outer,guide:outer};
  let k=0;
  for(let c=2;c<=Math.floor(n/2);c++) if(gcd(n,c)===1){k=c;break}
  if(k){const order=[...Array(n)].map((_,j)=>outer[(j*k)%n]);return{order,guide:order}}
  const ir=R*(n===4?0.42:0.58), path=[];
  for(let j=0;j<n;j++){
    path.push(outer[j]);
    const a2=ang(j)+Math.PI/n;
    path.push([ir*Math.cos(a2), -ir*Math.sin(a2)]);
  }
  return {order:outer,guide:path};
}

/* ══ 作図 ═════════════════════════════════════ */
function drawSystem(cx,cy,sys,rnd,boldOrbit){
  const {spec,r:sr}=starOf(sys.s), col=SPEC_COL[spec], g=[];
  const orbitOp = boldOrbit ? 1.0 : 0.6;
  ringsOf(sys).forEach((ring,i)=>{
    const r=R0+i*DR;
    if(ring.k==="A"){
      if(ring.v===0) return;                       // 空の帯 — 間そのものが情報
      g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="none" stroke="${ORB}" stroke-width="0.5" opacity="${(0.3*orbitOp/0.6).toFixed(2)}"/>`);
      const used=[];
      for(let q=0;q<ring.v;q++){
        let aa=0;
        for(let t=0;t<80;t++){
          aa=rnd()*2*Math.PI;
          if(used.every(u=>Math.abs(((aa-u+Math.PI)%(2*Math.PI))-Math.PI)>0.16)) break;
        }
        used.push(aa);
        g.push(`<circle cx="${(cx+r*Math.cos(aa)).toFixed(1)}" cy="${(cy+r*Math.sin(aa)).toFixed(1)}" r="1.5" fill="${A_COL}"/>`);
      }
    }else{
      g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="none" stroke="${ORB}" stroke-width="0.6" opacity="${orbitOp.toFixed(2)}"/>`);
      const ang=rnd()*2*Math.PI;
      const px=cx+r*Math.cos(ang), py=cy+r*Math.sin(ang);
      g.push(`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${PR}" fill="${P_COL}"/>`);
      for(let m=0;m<ring.v;m++){
        const ma=ang+1.15+m*2.09;
        g.push(`<circle cx="${(px+MD*Math.cos(ma)).toFixed(1)}" cy="${(py+MD*Math.sin(ma)).toFixed(1)}" r="${MR}" fill="${M_COL}"/>`);
      }
    }
  });
  g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(sr*3.2).toFixed(1)}" fill="${col}" opacity="0.10"/>`);
  g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(sr*1.6).toFixed(1)}" fill="${col}" opacity="0.22"/>`);
  g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${sr.toFixed(1)}" fill="${col}"/>`);
  return g.join("\n");
}

function buildSVG(text,opt){
  const sys=parse(text);
  if(!sys.length) return null;
  const rnd=mulberry32(hash(text)||1);
  const n=sys.length, rmax=Math.max(...sys.map(radiusOf));
  const R = n===1 ? 0 : n===2 ? 2*rmax+70 : (2*rmax+70)/(2*Math.sin(Math.PI/n));
  const {order,guide}=layout(n,R);
  const body=[]; let X=[],Y=[];
  order.forEach(([dx,dy],i)=>{
    body.push(drawSystem(dx,dy,sys[i],rnd,opt.bold));
    const rr=radiusOf(sys[i])+40;
    X.push(dx-rr,dx+rr); Y.push(dy-rr,dy+rr);
  });
  if(guide && opt.guide){
    const pts=guide.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    body.unshift(`<polygon points="${pts}" fill="none" stroke="#5878AC" stroke-width="1.6" stroke-dasharray="4 11" opacity="0.42"/>`);
  }
  const vx=Math.floor(Math.min(...X)), vy=Math.floor(Math.min(...Y));
  const vw=Math.ceil(Math.max(...X)-vx), vh=Math.ceil(Math.max(...Y)-vy);
  let field="";
  if(opt.field){
    const c=Math.round(vw*vh/52000), f=[];
    for(let i=0;i<c;i++) f.push(`<circle cx="${(vx+rnd()*vw).toFixed(1)}" cy="${(vy+rnd()*vh).toFixed(1)}" r="${rnd()<0.5?0.5:0.7}" fill="#8FA6D4" opacity="${(0.03+rnd()*0.03).toFixed(2)}"/>`);
    field=f.join("\n");
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${vw} ${vh}" width="${vw}" height="${vh}">`
    +`<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="#050912"/>`
    +field+"\n"+body.join("\n")+`</svg>`;
  return {svg,sys,n};
}

/* ══ 画面 ═════════════════════════════════════ */
const $=id=>document.getElementById(id);
let lastSVG="", lastText="";

function render(){
  const text=$("src").value;
  if(!text.trim()){ $("chart").innerHTML=""; $("strout").textContent="—"; $("ledger").innerHTML=""; return; }
  const opt={guide:$("tGuide").checked, field:$("tField").checked, bold:$("tRule").checked};
  const res=buildSVG(text,opt);
  if(!res) return;
  lastSVG=res.svg; lastText=text;
  $("chart").innerHTML=res.svg;
  const el=$("chart").firstElementChild;
  el.removeAttribute("width"); el.removeAttribute("height");
  el.setAttribute("preserveAspectRatio","xMidYMid meet");

  const form=toStringForm(res.sys);
  $("strout").textContent=form;
  $("etch").textContent=form;
  $("cipher").value=form;
  $("plateno").textContent=String(hash(text)%9973).padStart(4,"0");
  $("syscount").textContent=res.n+" system"+(res.n>1?"s":"");

  const rows=[];
  for(const s of res.sys){
    const st=starOf(s.s);
    s.chars.forEach((c,i)=>{
      const b4=toBase4(parseInt(c.p,16));
      rows.push(`<tr>
        <td class="ch">${c.ch}</td>
        <td>U+${hex6(c.ch.codePointAt(0))}</td>
        <td class="st">${i===0?st.spec+"型 "+st.dia:"〃"}</td>
        <td>${c.p}</td><td>${b4}</td>
        <td>${[...b4].join("・")}</td>
        <td>${c.a}</td>
        <td class="amb">${parseInt(c.a[0],16)}・${parseInt(c.a[1],16)}</td></tr>`);
    });
  }
  $("ledger").innerHTML=rows.join("");
}

$("enc").onclick=render;
$("src").addEventListener("input",()=>{clearTimeout(window._t);window._t=setTimeout(render,220)});
["tGuide","tField","tRule"].forEach(id=>$(id).onchange=render);

$("dec").onclick=()=>{
  const o=$("decout");
  try{
    const t=fromStringForm($("cipher").value);
    o.classList.remove("err"); o.textContent=t||"—";
  }catch(e){ o.classList.add("err"); o.textContent=e.message; }
};

function download(name,blob){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("dlsvg").onclick=()=>{ if(lastSVG) download("kousei.svg",new Blob([lastSVG],{type:"image/svg+xml"})); };
$("dlpng").onclick=()=>{
  if(!lastSVG) return;
  const img=new Image();
  img.onload=()=>{
    const scale=2, c=document.createElement("canvas");
    c.width=img.width*scale; c.height=img.height*scale;
    const x=c.getContext("2d"); x.scale(scale,scale); x.drawImage(img,0,0);
    c.toBlob(b=>download("kousei.png",b));
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(lastSVG);
};

/* ── 読み順表 ── */
$("sheet").onclick=()=>{
  const R=64, cells=[];
  for(let n=1;n<=8;n++){
    const {order,guide}=layout(n,R);
    const g=[];
    if(guide) g.push(`<polygon points="${guide.map(([x,y])=>`${(x+95).toFixed(1)},${(y+95).toFixed(1)}`).join(" ")}" fill="none" stroke="#4E6C9E" stroke-width="1.1" stroke-dasharray="3 8" opacity="0.55"/>`);
    order.forEach(([x,y],i)=>{
      const px=x+95, py=y+95;
      g.push(`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="6" fill="#9BB0FF" opacity="0.22"/>`);
      g.push(`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="#CFDBFF"/>`);
      let lx,ly;
      if(n<=2){lx=px+15;ly=py-8}else{const a=Math.atan2(y,x);lx=95+(R+17)*Math.cos(a);ly=95+(R+17)*Math.sin(a)}
      g.push(`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" fill="#F2C46B" font-family="Cormorant Garamond,serif" font-size="12" text-anchor="middle">${i+1}</text>`);
    });
    cells.push(`<svg viewBox="0 0 190 190" width="100%" style="max-width:190px">
      <text x="8" y="18" fill="#6E82AC" font-family="Cormorant Garamond,serif" font-size="13">${n}</text>${g.join("")}</svg>`);
  }
  $("ordersheet").innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${cells.join("")}</div>`;
  $("orderdlg").showModal();
};

render();
</script>
</body>
</html>
